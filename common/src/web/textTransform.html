<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>text-transform</title>
</head>
<body>

<a id="capitalized-latin" style="text-transform: capitalize">hello world</a><br/>
<a id="capitalized-latin-underscore" style="text-transform: capitalize">hello_world</a><br/>
<a id="capitalized-cyrillic" style="text-transform: capitalize">привет мир</a><br/>
<a id="capitalized-cyrillic-underscore" style="text-transform: capitalize">привет_мир</a><br/>
<a id="capitalized-greek" style="text-transform: capitalize">γειά σου κόσμε</a><br/>

</body>
</html>
