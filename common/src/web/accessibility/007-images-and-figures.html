<html id="root">
<head>
  <meta charset="utf-8">
  <title>Images and figures</title>
</head>
<body>
  <img id="img" src="../map.png" alt="A map">
  <img id="decorative" src="../map.png" alt="">
  <img id="no-alt" src="../map.png">
  <img id="titled" src="../map.png" title="Titled image">
  <figure id="figure"><img id="figure-img" src="../map.png" alt="Chart"><figcaption id="caption">Sales by month</figcaption></figure>
  <svg id="svg" width="10" height="10"><title>Logo</title><circle cx="5" cy="5" r="4"/></svg>
  <div id="aria-img" role="img" aria-label="Rating: 4 of 5"><span>★★★★☆</span></div>
  <map name="m"><area id="area" href="#" shape="rect" coords="0,0,1,1" alt="Zone"></map><img id="mapped" src="../map.png" usemap="#m" alt="Mapped">
</body>
</html>
