<html id="root">
<head>
  <meta charset="utf-8">
  <title>Details and dialog</title>
</head>
<body>
  <details id="details" open><summary id="summary">Settings</summary><p id="settings">Settings body</p></details>
  <dialog id="dialog" open aria-labelledby="dialog-title"><h2 id="dialog-title">Confirm</h2><p id="dialog-text">Are you sure?</p><button id="ok">OK</button></dialog>
  <div id="alert" role="alert">Saved.</div>
  <div id="status" role="status">3 items</div>
</body>
</html>
