<html id="root">
<head>
  <meta charset="utf-8">
  <title>Whitespace and generated content</title>
</head>
<body>
  <style>
    .icon::before { content: "★ "; }
    .suffix::after { content: " (external)"; }
    .alt::before { content: "✓" / "Done: "; }
    .block { display: block; }
  </style>
  <button id="icon" class="icon">Favourite</button>
  <a id="suffix" class="suffix" href="#">Site</a>
  <button id="alt" class="alt">Task</button>
  <a id="inline" href="#">Save<b>now</b></a>
  <a id="blocks" href="#"><span class="block">Line one</span><span class="block">Line two</span></a>
  <button id="br">First<br>Second</button>
  <p id="nbsp">Non&nbsp;breaking space</p>
  <pre id="pre">  preformatted
    text  </pre>
</body>
</html>
