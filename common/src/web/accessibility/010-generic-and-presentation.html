<html id="root">
<head>
  <meta charset="utf-8">
  <title>Generic wrappers and presentation</title>
</head>
<body id="body">
  <div id="wrap-1"><div id="wrap-2"><div id="wrap-3"><h2 id="deep">Hoisted through wrappers</h2><span id="loose">loose text</span></div></div></div>
  <div id="role-none" role="none"><p id="inside-none">Paragraph inside role none</p></div>
  <ul id="pres-ul" role="presentation"><li id="pres-li">Presentational list item text</li></ul>
  <table id="pres-table" role="none"><tbody id="pres-tbody"><tr id="pres-tr"><td id="pres-td">Presentational cell text</td></tr></tbody></table>
  <a id="pres-link" role="presentation" href="https://example.com/presentation">Focusable, so still a link</a>
  <img id="pres-img" src="../map.png" alt="" role="none">
  <div id="custom-generic" aria-label="Named div"></div>
  <custom-element id="custom">Custom element text</custom-element>
</body>
</html>
