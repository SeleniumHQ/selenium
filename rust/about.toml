# cargo-about config for the third-party NOTICE (see the sbom job in ci-rust.yml).

# All shipped triples, so the NOTICE covers target-gated crates (winapi/windows-*).
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "i686-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

ignore-dev-dependencies = true

[private]
ignore = true

# An unlisted license fails generation; add new ones only after review.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
]

# ring has a license-file, not an SPDX expression; the built-in workaround attributes it.
workarounds = [
    "ring",
]
