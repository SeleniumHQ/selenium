name: CI - Python

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      smoke:
        description: Run smoke tests only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.smoke)
    uses: ./.github/workflows/bazel.yml
    with:
      name: Build
      run: |
        bazel build //py:selenium-wheel //py:selenium-sdist

  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      name: Lint
      run: ./go py:lint

  unit-tests:
    name: Unit Tests
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.smoke)
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        os: [ubuntu, macos, windows]
    with:
      name: Unit Tests (${{ matrix.python-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      run: bazel test --local_test_jobs 1 //py:unit

  browser-tests-smoke:
    name: ${{ matrix.os }}-smoke
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.smoke)
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
    with:
      name: ${{ matrix.os }}-smoke
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      run: >
        ./scripts/github-actions/bazel-test-if-targets.sh
        --keep_going
        --build_tests_only
        --flaky_test_attempts 3
        --local_test_jobs 1
        --skip_incompatible_explicit_targets
        --pin_browsers=false
        --test_tag_filters=os-sensitive,skip-rbe,se-manager
        ${{ inputs.targets || '//py/...' }}

  browser-tests-full:
    name: Browser Tests (full)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.smoke)
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, chrome-bidi, edge]
        os: [windows]
        include:
          - browser: safari
            os: macos
    with:
      name: Integration Tests (${{ matrix.browser }})
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      run: >
        ./scripts/github-actions/bazel-test-if-targets.sh
        --keep_going
        --flaky_test_attempts 3
        --local_test_jobs 1
        --pin_browsers=false
        //py:test-${{ matrix.browser }}
