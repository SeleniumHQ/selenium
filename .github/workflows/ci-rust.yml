name: CI - Rust

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [macos, ubuntu, ubuntu-24.04-arm, windows]
        # macOS runners are scarce, so only use for PRs and nightly runs
        exclude:
          - os: ${{ github.event_name == 'push' && 'macos' || '' }}
    with:
      name: Tests (${{ matrix.os }})
      os: ${{ matrix.os }}
      rerun-with-debug: true
      run: bazel test --test_env=RUST_BACKTRACE=full --test_env=RUST_TEST_NOCAPTURE=1 --flaky_test_attempts=3 //rust/...
