name: mirror-selenium-releases

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: trunk
        persist-credentials: false
    - name: Read api.github.com and filter response
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./scripts/github-actions/update_selenium_mirror.sh
    - name: Commit files
      id: git
      run: |
        CHANGES=$(git status -s)
        export CHANGES
        if [ -n "$CHANGES" ]; then
          git config --local user.email "selenium-ci@users.noreply.github.com"
          git config --local user.name "Selenium CI Bot"
          git add common/mirror/selenium
          git commit -m "Update mirror info ($(date))" -a
          echo "commit=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Push changes
      if: steps.git.outputs.commit == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.SELENIUM_CI_TOKEN }}
        branch: trunk
