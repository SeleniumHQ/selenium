name: CI - .NET

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      name: Lint
      os: windows
      run: ./go dotnet:lint

  # Separate from the Windows lint job, which formatting would lengthen by over a minute.
  format:
    name: Format
    uses: ./.github/workflows/bazel.yml
    with:
      name: Format
      run: |
        ./go dotnet:format
        ./scripts/github-actions/check-format-diff.sh

  docs:
    name: Docs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bazel.yml
    with:
      name: Docs
      run: ./go dotnet:docs_generate

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/bazel.yml
    with:
      name: Unit Tests
      os: ubuntu
      run: bazel test //dotnet/test/unit/... --flaky_test_attempts=1

  integration-tests:
    name: Browser Tests
    uses: ./.github/workflows/bazel.yml
    with:
      name: Browser Tests
      os: windows
      needs-display: true
      rerun-with-debug: true
      remote-cache: true
      run: |
        bazel test --local_resources=browser=1 --manager=host //dotnet/test/webdriver:ElementFindingTests-firefox //dotnet/test/webdriver:ElementFindingTests-chrome

  remote-tests:
    name: Remote Tests
    uses: ./.github/workflows/bazel.yml
    with:
      name: Remote Tests
      os: windows
      needs-display: true
      rerun-with-debug: true
      remote-cache: true
      run: |
        bazel test --local_resources=browser=1 --manager=host //dotnet/test/remote --flaky_test_attempts=3
