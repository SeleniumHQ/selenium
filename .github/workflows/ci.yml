name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/decisions/**'
  push:
    branches:
      - trunk
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      name: Check Workflows and Shell
      run: ./go lint_workflows && ./go lint_shell

  format:
    name: Format
    uses: ./.github/workflows/bazel.yml
    with:
      name: Check Format
      run: |
        ./go format
        if ! git diff --quiet; then
          echo "::error::Code needs formatting. Run './go format' locally and push changes."
          git diff
          exit 1
        fi

  # Everything but the release PR holds its binding jobs while trunk is locked, so macOS runners stay free for the release.
  wait-for-unlock:
    name: Wait for Trunk Unlock
    if: ${{ !(startsWith(github.head_ref, 'release-preparation-') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq 'any(.[]; .name == "Release: Restrict Trunk")' | grep -q true; do
            echo "Trunk is locked for a release; waiting"
            sleep 60
          done

  targets:
    name: Select Targets
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.select.outputs.java }}
      py: ${{ steps.select.outputs.py }}
      rb: ${{ steps.select.outputs.rb }}
      dotnet: ${{ steps.select.outputs.dotnet }}
      rust: ${{ steps.select.outputs.rust }}
      js: ${{ steps.select.outputs.js }}
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
      - name: Select targets
        id: select
        env:
          FORK: ${{ github.event.repository.fork }}
          RELEASE_PR: ${{ startsWith(github.head_ref, 'release-preparation-') && github.event.pull_request.head.repo.full_name == github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$FORK" = "true" ]; then
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" =~ ^(pull_request|push)$ ]] && [ "$RELEASE_PR" != "true" ] && git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            ./go bazel:affected_targets "$BASE_SHA..HEAD"
            targets=$(cat build/bazel-targets.txt)
          else
            targets="//java/... //py/... //rb/... //dotnet/... //rust/... //javascript/..."
          fi
          check_target() {
            local pattern=$1 tag=$2
            if [[ "$targets" == *"${pattern}/"* ]] || [[ "$COMMIT_MESSAGES" == *"[$tag]"* ]] || [[ "$PR_TITLE" == *"[$tag]"* ]]; then
              echo "$tag=true" >> "$GITHUB_OUTPUT"
            fi
          }
          check_target "//java" "java"
          check_target "//dotnet" "dotnet"
          check_target "//rust" "rust"
          check_target "//rb" "rb"
          check_target "//py" "py"
          check_target "//javascript" "js"

  dotnet:
    name: .NET
    needs: [targets, wait-for-unlock]
    uses: ./.github/workflows/ci-dotnet.yml
    if: "!cancelled() && needs.targets.outputs.dotnet != ''"

  java:
    name: Java
    needs: [targets, wait-for-unlock]
    uses: ./.github/workflows/ci-java.yml
    if: "!cancelled() && needs.targets.outputs.java != ''"

  python:
    name: Python
    needs: [targets, wait-for-unlock]
    uses: ./.github/workflows/ci-python.yml
    if: "!cancelled() && needs.targets.outputs.py != ''"
    with:
      smoke: ${{ !(github.head_ref == 'pinned-browser-updates' && contains(github.event.pull_request.title, '(major)')) }}

  ruby:
    name: Ruby
    needs: [targets, wait-for-unlock]
    uses: ./.github/workflows/ci-ruby.yml
    if: "!cancelled() && needs.targets.outputs.rb != ''"
    with:
      smoke: ${{ !(github.head_ref == 'pinned-browser-updates' && contains(github.event.pull_request.title, '(major)')) }}

  rust:
    name: Rust
    needs: [targets, wait-for-unlock]
    uses: ./.github/workflows/ci-rust.yml
    if: "!cancelled() && needs.targets.outputs.rust != ''"

  javascript:
    name: JavaScript
    needs: [targets, wait-for-unlock]
    uses: ./.github/workflows/ci-javascript.yml
    if: "!cancelled() && needs.targets.outputs.js != ''"

  merge-test-health:
    name: Merge Test Health
    if: always() && github.event_name == 'schedule' && github.ref == 'refs/heads/trunk'
    needs: [dotnet, java, python, ruby, rust, javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
      - name: Download results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: test-health-*
          path: build/test-health-artifacts
      - name: Merge results
        id: merge
        shell: bash
        run: ./scripts/github-actions/merge-test-health.sh
      - name: Upload results
        if: steps.merge.outputs.results == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: merged-test-health-${{ github.run_id }}
          retention-days: 60
          path: build/test-health/results.jsonl
          overwrite: true

  ci-success:
    name: CI Success
    if: always()
    needs: [lint, format, targets, dotnet, java, python, ruby, rust, javascript]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more required jobs failed"
            exit 1
          fi
