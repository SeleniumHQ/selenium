name: Shared - Build Index

permissions:
  contents: read

on:
  workflow_call:

jobs:
  build:
    name: Build Test Index
    uses: ./.github/workflows/bazel.yml
    with:
      name: Build Test Index
      os: ubuntu
      run: ./go bazel:build_test_index bazel-test-file-index
      artifact-name: bazel-test-file-index
      artifact-path: bazel-test-file-index
