name: Renovate Dependencies

on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Base branch or ref to update
        required: true
        default: trunk
        type: string

concurrency:
  group: renovate-dependencies
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-updates:
    name: Prepare Bazel updates
    if: github.event.repository.fork == false
    uses: ./.github/workflows/bazel.yml
    with:
      name: Prepare Bazel updates
      ref: ${{ inputs.base-ref }}
      caching: false
      run: |
        ./go all:update
        ./go rust:update
      artifact-name: bazel-updates

  push-update-branch:
    name: Push Bazel update branch
    needs: prepare-updates
    if: github.event.repository.fork == false
    uses: ./.github/workflows/commit-changes.yml
    with:
      artifact-name: bazel-updates
      commit-message: "Update dependencies"
      ref: ${{ inputs.base-ref }}
      push-branch: temp/bazel-updates
    secrets:
      SELENIUM_CI_TOKEN: ${{ secrets.SELENIUM_CI_TOKEN }}

  renovate:
    name: Renovate ${{ matrix.kind }} dependencies
    needs: push-update-branch
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [minor, major]
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v6
        with:
          ref: temp/bazel-updates
      - name: Reset eval branch
        env:
          EVAL_BRANCH: renovate/${{ matrix.kind }}-eval
        run: |
          if git ls-remote --exit-code --heads origin "$EVAL_BRANCH" >/dev/null; then
            git push origin --delete "$EVAL_BRANCH"
          fi
      - name: Configure Renovate
        env:
          KIND: ${{ matrix.kind }}
        run: |
          if [ "$KIND" = "major" ]; then
            update_rules='[{"enabled": false}, {"matchUpdateTypes": ["major"], "enabled": true}]'
          else
            update_rules='[{"matchUpdateTypes": ["major"], "enabled": false}]'
          fi

          {
            echo "RENOVATE_FORCE<<RENOVATE_FORCE_EOF"
            jq -n \
              --arg kind "$KIND" \
              --argjson update_rules "$update_rules" \
              '{
                baseBranchPatterns: ["temp/bazel-updates"],
                dependencyDashboard: false,
                dependencyDashboardApproval: false,
                prCreation: "approval",
                pruneStaleBranches: false,
                schedule: null,
                packageRules: ($update_rules + [
                  {
                    groupName: ($kind + " dependency updates"),
                    groupSlug: ($kind + "-eval")
                  }
                ])
              }'
            echo "RENOVATE_FORCE_EOF"
          } >> "$GITHUB_ENV"
      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ secrets.SELENIUM_CI_TOKEN || github.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}

  dependency-pr:
    name: ${{ matrix.kind }} dependency PR
    needs: renovate
    if: always() && github.event.repository.fork == false
    strategy:
      fail-fast: false
      matrix:
        kind: [minor, major]
    uses: ./.github/workflows/renovate-dependency-pr.yml
    with:
      base-ref: ${{ inputs.base-ref }}
      kind: ${{ matrix.kind }}
    secrets:
      SELENIUM_CI_TOKEN: ${{ secrets.SELENIUM_CI_TOKEN }}
