name: CI - Java

on:
  workflow_call:
    inputs:
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      compile-manager:
        description: Build Selenium Manager from source instead of downloading the pinned binary
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser-tests-windows:
    name: Browser Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
    with:
      name: Browser Tests (chrome, ${{ matrix.os }})
      os: ${{ matrix.os }}
      needs-display: true
      rerun-with-debug: true
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --flaky_test_attempts 2
        --local_test_jobs 1
        --pin_browsers=false
        ${{ inputs.compile-manager && '--manager=host' || '' }}
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_tag_filters=unit,os-sensitive
        //java/...

  browser-tests-macos:
    name: Browser Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
    with:
      name: Browser Tests (chrome, ${{ matrix.os }})
      os: ${{ matrix.os }}
      needs-display: true
      rerun-with-debug: true
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --flaky_test_attempts 2
        --local_test_jobs 1
        --pin_browsers=false
        ${{ inputs.compile-manager && '--manager=host' || '' }}
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_tag_filters=unit,os-sensitive
        //java/...
