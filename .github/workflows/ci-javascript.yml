name: CI - JavaScript

on:
  workflow_call:
    inputs:
      targets:
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filter-targets:
    name: Filter Targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.filter.outputs.targets }}
    steps:
    - name: Filter JavaScript targets
      id: filter
      shell: bash
      run: |
        targets="${{ inputs.targets }}"
        filtered=()

        for t in $targets; do
          [[ "$t" == //javascript/selenium-webdriver* ]] && filtered+=("$t")
        done

        if [ ${#filtered[@]} -eq 0 ]; then
          echo "targets=//javascript/selenium-webdriver/..." >> "$GITHUB_OUTPUT"
        else
          echo "targets=${filtered[*]}" >> "$GITHUB_OUTPUT"
        fi

  browser-tests:
    name: Browser Tests
    needs: filter-targets
    uses: ./.github/workflows/bazel.yml
    with:
      name: Browser Tests
      os: windows
      browser: true
      run: >
        bazel test
        --keep_going
        --build_tests_only
        --flaky_test_attempts 3
        --local_test_jobs 1
        --test_tag_filters=-lint
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        ${{ needs.filter-targets.outputs.targets }}
