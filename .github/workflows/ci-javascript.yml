name: CI - JavaScript

on:
  workflow_call:
    inputs:
      smoke:
        description: Smoke tests always run; callers pass false to add the full matrix
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke tests only (default also runs the full matrix)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# RBE runs the Linux x86_64 tests; these jobs cover macOS and Windows.
jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      name: Lint
      run: |
        ./go node:lint
        ./scripts/github-actions/check-format-diff.sh

  docs:
    name: Docs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bazel.yml
    with:
      name: Docs
      run: ./go node:docs_generate

  # Tests on 22.23.4 (earliest supported version) are run in smoke and RBE.
  # This job covers the latest supported version.
  unit-tests:
    name: Unit Tests
    if: github.event_name == 'schedule' || !inputs.smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.12.1']
        os: [ubuntu]
    with:
      name: Unit Tests (${{ matrix.node-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      run: bazel test //javascript/selenium-webdriver:small-tests

  smoke:
    name: ${{ matrix.os }}-smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows]
        tag_filters: ['unit,os-sensitive,se-manager']
    with:
      name: ${{ matrix.os }}
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      remote-cache: true
      run: >
        ./scripts/github-actions/bazel-test-if-targets.sh
        --config=gh-browser
        --test_tag_filters=${{ matrix.tag_filters }}${{ matrix.os == 'macos' && (github.event_name == 'pull_request' || github.event_name == 'push') && ',-edge' || '' }}
        //javascript/selenium-webdriver/...

  os-tests-full:
    name: ${{ matrix.os }}-full
    if: github.event_name == 'schedule' || !inputs.smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows]
        tag_filters: ['chrome,-remote', 'firefox,-remote', 'edge', 'chrome-remote', 'firefox-remote']
    with:
      name: (${{ matrix.tag_filters }})
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      remote-cache: true
      run: >
        bazel test
        --config=gh-browser
        --test_tag_filters=${{ matrix.tag_filters }},-os-sensitive,-se-manager
        //javascript/selenium-webdriver/...
