name: CI - JavaScript

on:
  workflow_call:
    inputs:
      smoke:
        description: Smoke tests always run; callers pass false to add the full matrix
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke tests only (default also runs the full matrix)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# RBE runs the Linux x86_64 tests; these jobs cover macOS and Windows.
jobs:
  build:
    name: Build
    uses: ./.github/workflows/bazel.yml
    with:
      name: Build
      run: bazel build //javascript/selenium-webdriver

  # Prettier is checked by ci-lint.yml.
  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      name: Lint
      run: bazel test //javascript/selenium-webdriver:eslint-test

  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.0', '24.14.1']
        os: [ubuntu]
    with:
      name: Unit Tests (${{ matrix.node-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      node-version: ${{ matrix.node-version }}
      run: bazel test --local_test_jobs 1 //javascript/selenium-webdriver:small-tests

  smoke:
    name: ${{ matrix.os }}-smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows]
        tag_filters: ['os-sensitive,se-manager']
    with:
      name: ${{ matrix.os }}
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      download-artifact-name: targets
      run: >
        [ -s bazel-targets-js.txt ] || echo //javascript/selenium-webdriver/... > bazel-targets-js.txt;
        ./scripts/github-actions/bazel-test-if-targets.sh
        --keep_going
        --flaky_test_attempts 3
        --local_test_jobs 1
        --build_tests_only
        --skip_incompatible_explicit_targets
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_tag_filters=${{ matrix.tag_filters }}
        --target_pattern_file=bazel-targets-js.txt

  os-tests-full:
    name: ${{ matrix.os }}-full
    if: github.event_name == 'schedule' || !inputs.smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows]
        tag_filters: ['chrome,-remote', 'firefox,-remote', 'edge', 'chrome-remote', 'firefox-remote']
    with:
      name: (${{ matrix.tag_filters }})
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      run: >
        bazel test
        --keep_going
        --flaky_test_attempts 3
        --local_test_jobs 1
        --build_tests_only
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_tag_filters=${{ matrix.tag_filters }},-os-sensitive,-se-manager
        //javascript/selenium-webdriver/...
