name: Prune CodeQL caches

on:
  workflow_run:
    # No branch filter: CodeQL runs mostly from pull requests, and those caches
    # count against the same 10 GiB repo budget as the trunk ones.
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: prune-codeql-caches
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  prune:
    name: Prune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prune stale CodeQL caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/github-actions/prune-codeql-caches.sh --delete
