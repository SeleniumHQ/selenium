name: Scheduled - Report Flaky Tests

on:
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    name: Report Flaky Tests
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v6
      - name: Build report
        id: report
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/github-actions/flaky-report.sh
      - name: Slack Notification
        if: github.event_name == 'schedule' && steps.report.outputs.notify == 'true'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_ICON_EMOJI: ':warning:'
          SLACK_COLOR: warning
          SLACK_CHANNEL: selenium-tlc
          SLACK_USERNAME: GitHub Workflows
          SLACK_TITLE: Flakiness Report
          SLACK_MESSAGE: "${{ steps.report.outputs.message }}: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view report>"
          MSG_MINIMAL: true
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
