name: Scheduled - Update CDDL

on:
  schedule:
    - cron: 20 0 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update CDDL Specs
    uses: ./.github/workflows/update-pr.yml
    permissions:
      contents: write
      pull-requests: write
      actions: read
    with:
      run: |
        ./go update_cddl
        if git diff --quiet -- common/bidi/schema.json; then git reset -q --hard; fi
      branch: automated-cddl-updates
      title: "[build] Automated CDDL Spec Update"
      body: |
        This is an automated pull request to repin the CDDL grammars and definition
        indexes from w3c/webref, the rendered WebDriver BiDi spec from
        w3c/webdriver-bidi, and the vendor CDDL grammars from mozilla-firefox/firefox.

        Auto-generated by the [update-cddl workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
    secrets:
      SELENIUM_CI_TOKEN: ${{ secrets.SELENIUM_CI_TOKEN }}

  on-failure:
    name: On CDDL Update Failure
    runs-on: ubuntu-latest
    needs: update
    if: failure() || cancelled()
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_ICON_EMOJI: ":rotating_light:"
          SLACK_COLOR: failure
          SLACK_CHANNEL: selenium-tlc
          SLACK_USERNAME: GitHub Workflows
          SLACK_MESSAGE: "Needs investigation: unable to create the daily CDDL Update PR. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
          MSG_MINIMAL: true
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
