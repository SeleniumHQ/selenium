name: Commit Changes

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of artifact containing changes.patch
        required: true
        type: string
      commit-message:
        description: Commit message
        required: true
        type: string
      ref:
        description: Git ref to checkout
        required: false
        type: string
        default: ''
      push-branch:
        description: Branch to push to (defaults to current branch, uses force push)
        required: false
        type: string
        default: ''
    outputs:
      changes-committed:
        description: Whether changes were committed and pushed
        value: ${{ jobs.commit.outputs.committed }}
    secrets:
      SELENIUM_CI_TOKEN:
        required: false

jobs:
  commit:
    name: Commit Changes
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.SELENIUM_CI_TOKEN || github.token }}
      - name: Download patch
        id: download
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
        continue-on-error: true
      - name: Apply and commit
        id: commit
        run: |
          git config --local user.email "selenium-ci@users.noreply.github.com"
          git config --local user.name "Selenium CI Bot"
          committed=false
          if [ -s changes.patch ]; then
            git apply --index changes.patch
            git commit -m "$COMMIT_MESSAGE"
            committed=true
          fi
          if [ -n "$PUSH_BRANCH" ]; then
            git push --force origin HEAD:"$PUSH_BRANCH"
          elif [ "$committed" = true ]; then
            git push
          fi
          echo "committed=$committed" >> "$GITHUB_OUTPUT"
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          PUSH_BRANCH: ${{ inputs.push-branch }}
