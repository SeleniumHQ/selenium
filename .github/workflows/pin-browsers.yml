name: Scheduled - Update Browsers
on:
  schedule:
    - cron: 10 0 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update Pinned Browsers
    uses: ./.github/workflows/update-pr.yml
    permissions:
      contents: write
      pull-requests: write
      actions: read
    with:
      run: ./scripts/github-actions/update_browsers.sh
      branch: pinned-browser-updates
      title: "[build] Automated Browser Version Update"
      body: |
        This is an automated pull request to update pinned browsers and drivers. "(major)" in the title means a Chrome or Firefox major bump, so CI runs the full Python and Ruby browser matrix; "with CDP" means Chrome DevTools (CDP) was regenerated to match.

        Merge after verifying the new browser versions are properly passing the tests
    secrets:
      SELENIUM_CI_TOKEN: ${{ secrets.SELENIUM_CI_TOKEN }}

  on-failure:
    name: On Browser Update Failure
    runs-on: ubuntu-latest
    needs: update
    if: failure() || cancelled()
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_ICON_EMOJI: ":rotating_light:"
          SLACK_COLOR: failure
          SLACK_CHANNEL: selenium-tlc
          SLACK_USERNAME: GitHub Workflows
          SLACK_MESSAGE: "Needs investigation: unable to create the daily Browser Update PR. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
          MSG_MINIMAL: true
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
