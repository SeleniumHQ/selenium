name: CI - RBE

on:
  pull_request:
    paths-ignore:
      - 'docs/decisions/**'
  push:
    branches:
      - trunk
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      disable_test_cache:
        description: 'Force re-run of tests (disable test cache)'
        required: false
        default: false
        type: boolean
  workflow_call:

concurrency:
  group: ci-rbe-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  # Everything but the release PR waits while trunk is locked, so RBE stays free for the release.
  wait-for-unlock:
    name: Wait for Trunk Unlock
    if: ${{ !startsWith(github.head_ref, 'release-preparation-') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq 'any(.[]; .name == "Release: Restrict Trunk")' | grep -q true; do
            echo "Trunk is locked for a release; waiting"
            sleep 60
          done

  test:
    name: Test
    needs: wait-for-unlock
    if: ${{ !cancelled() && github.event.repository.fork == false }}
    uses: ./.github/workflows/bazel.yml
    with:
      name: All RBE tests
      rerun-with-debug: true
      ruby-version: jruby-10.1.0.0
      run: SKIP_RELEASE_ARTIFACTS=${{ startsWith(github.head_ref, 'release-preparation-') }} ./scripts/github-actions/ci-build.sh ${{ github.event_name == 'schedule' || github.event.inputs.disable_test_cache }}

  # Warm stamped build cache prior to release
  prepare-release:
    name: Prepare Release
    if: github.event.repository.fork == false && (github.ref == 'refs/heads/trunk' || startsWith(github.head_ref, 'release-preparation-'))
    uses: ./.github/workflows/bazel.yml
    with:
      name: Prepare Release
      ruby-version: jruby-10.1.0.0
      run: ./scripts/github-actions/prepare-release.sh
