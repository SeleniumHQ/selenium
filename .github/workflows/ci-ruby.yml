name: CI - Ruby

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      smoke:
        description: Run smoke tests only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  window-reset-experiment:
    name: window-reset-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
    uses: ./.github/workflows/bazel.yml
    with:
      name: window-reset-${{ matrix.os }}
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      run: >
        bazel test
        --keep_going
        --flaky_test_attempts 1
        --local_test_jobs 1
        --skip_incompatible_explicit_targets
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_env=SKIP_PENDING=true
        --test_output=all
        //rb/spec/integration/selenium/webdriver:window-chrome
        //rb/spec/integration/selenium/webdriver:window-edge
        //rb/spec/integration/selenium/webdriver:window-firefox
        //rb/spec/integration/selenium/webdriver:window-safari
