name: CI - Ruby

# WIP: temporary debug workflow for investigating Windows server-start
# JVM crash (EXCEPTION_ACCESS_VIOLATION in jvm.dll). Revert before merge.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bazel-single-debug:
    name: Bazel single remote test (windows, debug)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          # Workaround for Windows long path issues
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Set resolution
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run single test with debug
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # -Xshare:on forces a clean failure if CDS can't load (instead
          # of the partial-success-then-crash we saw with default sharing).
          bazel test \
            --test_output=streamed \
            --cache_test_results=no \
            --test_env=SE_DEBUG=true \
            --test_env=JDK_JAVA_OPTIONS="-XX:ErrorFile=D:/hs_err_pid%p.log -Xshare:on" \
            //rb/spec/integration/selenium/webdriver:select-firefox-remote
      - name: Inspect bazel-bundled JDK (external cache vs runfiles)
        if: always()
        shell: bash
        run: |
          set -x
          OUTPUT_BASE=$(bazel info output_base 2>/dev/null)

          echo "=== all remotejdk25* dirs in external ==="
          find "$OUTPUT_BASE/external" -maxdepth 1 -name '*remotejdk25*' -type d

          # Real JDK has bin/java.exe; config_repos don't.
          EXT_JDK=""
          for d in "$OUTPUT_BASE/external"/*remotejdk25*; do
            if [ -x "$d/bin/java.exe" ]; then
              EXT_JDK="$d"
              break
            fi
          done
          echo "=== external JDK: $EXT_JDK ==="
          if [ -n "$EXT_JDK" ]; then
            echo "--- bin/server contents (windows CDS lives here) ---"
            find "$EXT_JDK/bin/server" -maxdepth 1 -printf '%y %s %f\n' 2>/dev/null || echo "(missing)"
            echo "--- classes.jsa sha256 ---"
            sha256sum "$EXT_JDK/bin/server/classes.jsa" 2>/dev/null || echo "(no classes.jsa)"
          fi

          # Runfiles: find through bazel-bin symlink can be flaky on
          # windows. Construct the absolute path from output_base, which
          # the hs_err already showed us.
          RUNFILES_BASE="$OUTPUT_BASE/execroot/_main/bazel-out/x64_windows-fastbuild/bin/rb/spec/integration/selenium/webdriver/select-firefox-remote.cmd.runfiles"
          echo "=== runfiles base: $RUNFILES_BASE ==="
          find "$RUNFILES_BASE" -maxdepth 1 -printf '%y %f\n' 2>/dev/null | head -20 || echo "(runfiles dir missing)"
          # Surface the runfiles manifest if bazel used one instead of
          # materializing the tree.
          find "${RUNFILES_BASE}_manifest" -maxdepth 0 -printf '%s %p\n' 2>/dev/null || true

          RUNFILES_JDK=""
          for d in "$RUNFILES_BASE"/*remotejdk25*; do
            if [ -x "$d/bin/java.exe" ]; then
              RUNFILES_JDK="$d"
              break
            fi
          done
          echo "=== runfiles JDK: $RUNFILES_JDK ==="
          if [ -n "$RUNFILES_JDK" ]; then
            echo "--- bin/server contents (windows CDS lives here) ---"
            find "$RUNFILES_JDK/bin/server" -maxdepth 1 -printf '%y %s %f\n' 2>/dev/null || echo "(missing)"
            echo "--- classes.jsa sha256 ---"
            sha256sum "$RUNFILES_JDK/bin/server/classes.jsa" 2>/dev/null || echo "(no classes.jsa)"
          fi

          echo "EXT_JDK=$EXT_JDK" >> "$GITHUB_ENV"
      - name: Run server with bazel JDK at short path (no bazel sandbox)
        if: always()
        shell: bash
        continue-on-error: true
        env:
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/bazeljdk_hs_err_pid%p.log"
        run: |
          set -x
          if [ -z "$EXT_JDK" ] || [ ! -x "$EXT_JDK/bin/java.exe" ]; then
            echo "no usable bazel JDK found - skipping"
            exit 0
          fi
          # Copy the *exact same* bazel-bundled JDK out of bazel's external
          # cache to a short path with no bazel sandbox env. If it still
          # crashes here, the rules_java JDK distribution itself is broken.
          # If it works here but the bazel test crashed, the issue is the
          # runfiles layout / sandbox.
          rm -rf D:/bazeljdk
          cp -r "$EXT_JDK" D:/bazeljdk
          ls D:/bazeljdk/bin/java.exe || { echo "copy failed - no java.exe at D:/bazeljdk/bin/"; exit 0; }
          JAR="bazel-bin/java/src/org/openqa/selenium/grid/selenium_server_deploy.jar"
          test -f "$JAR" || { echo "jar missing"; exit 0; }
          D:/bazeljdk/bin/java.exe -version 2>&1 || true
          D:/bazeljdk/bin/java.exe -jar "$JAR" standalone --port 4445 &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"
          sleep 15
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "server alive after 15s - killing"
            kill "$SERVER_PID" 2>/dev/null || true
          else
            echo "server exited early"
          fi
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Collect hs_err and test outputs
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          # JVM crash reports land at the absolute path we set via
          # -XX:ErrorFile, no need to walk the drive.
          cp D:/hs_err_pid*.log build/debug/ 2>/dev/null || true
          cp D:/hs_err_pid*.mdmp build/debug/ 2>/dev/null || true
          cp D:/bazeljdk_hs_err_pid*.log build/debug/ 2>/dev/null || true
          cp D:/bazeljdk_hs_err_pid*.mdmp build/debug/ 2>/dev/null || true
          # Bazel test logs
          TESTLOGS=$(bazel info bazel-testlogs 2>/dev/null || true)
          if [ -n "$TESTLOGS" ] && [ -d "$TESTLOGS" ]; then
            find "$TESTLOGS" -name 'test.log' -exec cp --parents {} build/debug/ \; 2>/dev/null || true
            find "$TESTLOGS" -name 'test.outputs*.zip' -exec cp --parents {} build/debug/ \; 2>/dev/null || true
          fi
          find build/debug -type f -printf '%s %p\n' 2>/dev/null || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-bazel-single-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7

