name: CI - Ruby

# Throwaway diagnostic for Ruby Windows remote cache misses; never merge.
on:
  workflow_call:
    inputs:
      smoke:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      smoke:
        required: false
        type: boolean
        default: false
      cache_write:
        description: Write the EngFlow remote cache (diagnostic branch only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  windows-smoke:
    name: windows-smoke-${{ inputs.cache_write && 'write' || 'read' }}
    uses: ./.github/workflows/bazel.yml
    with:
      name: windows-smoke-${{ inputs.cache_write && 'write' || 'read' }}
      os: windows
      needs-display: true
      remote-cache: true
      artifact-name: ruby-windows-smoke-${{ inputs.cache_write && 'write' || 'read' }}
      artifact-path: build/diag/
      run: >
        ./scripts/github-actions/ruby-windows-cache-diag.sh
        --config=gh-browser
        --test_env=SKIP_PENDING=true
        --test_tag_filters=unit,os-sensitive,se-manager,skip-rbe
        //rb/...
