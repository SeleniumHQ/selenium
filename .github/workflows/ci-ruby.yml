name: CI - Ruby

on:
  workflow_call:
    inputs:
      smoke:
        description: Smoke tests always run; callers pass false to add the full matrix
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke tests only (default also runs the full matrix)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build Gems
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bazel.yml
    with:
      name: Build Gems
      run: bazel build //rb:selenium-devtools //rb:selenium-webdriver

  lint:
    name: Lint
    uses: ./.github/workflows/bazel.yml
    with:
      name: Lint
      run: |
        ./go rb:lint
        ./scripts/github-actions/check-format-diff.sh

  docs:
    name: Docs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bazel.yml
    with:
      name: Docs
      run: ./go rb:docs_generate

  # Tests on 3.3.12 (earliest supported version) are run in smoke and RBE.
  # This job covers the latest supported version and alternate interpreters.
  unit-tests:
    name: Unit Tests
    if: github.event_name == 'schedule' || !inputs.smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: 4.0.6
            os: ubuntu
          - ruby-version: jruby-10.1.0.0
            os: ubuntu
          - ruby-version: truffleruby-34.0.1
            os: ubuntu
    with:
      name: Unit Tests (${{ matrix.ruby-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      ruby-version: ${{ matrix.ruby-version }}
      run: >
        bazel test
        --build_tests_only
        --keep_going
        --test_size_filters small
        //rb/...

  smoke:
    name: ${{ matrix.os }}-smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos]
        tag_filters: ["unit,os-sensitive,se-manager,skip-rbe"]
        include:
          # Edge has no linux-arm64 build
          - os: ubuntu-24.04-arm
            tag_filters: "unit,os-sensitive,se-manager,skip-rbe,-edge"
    with:
      name: ${{ matrix.os }}
      needs-display: true
      os: ${{ matrix.os }}
      rerun-with-debug: true
      remote-cache: true
      run: >
        ./scripts/github-actions/bazel-test-if-targets.sh
        --config=gh-browser
        --test_env=SKIP_PENDING=true
        --test_tag_filters=${{ matrix.tag_filters }}${{ matrix.os == 'macos' && (github.event_name == 'pull_request' || github.event_name == 'push') && ',-edge' || '' }}
        //rb/...

  os-tests-full:
    name: ${{ matrix.os }}-full
    if: github.event_name == 'schedule' || !inputs.smoke
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows]
        tag_filters:
          - chrome-beta-local,chrome-beta-bidi
          - firefox-beta-local,firefox-beta-bidi
          - edge-local,edge-bidi,chrome-grid,firefox-grid,edge-grid
        include:
          - os: macos
            tag_filters: safari-local,safari-preview-bidi,safari-grid
    with:
      name: (${{ matrix.tag_filters }})
      needs-display: true
      safari-preview: ${{ contains(matrix.tag_filters, 'safari-preview') }}
      os: ${{ matrix.os }}
      rerun-with-debug: true
      remote-cache: true
      run: >
        bazel test
        --config=gh-browser
        --test_tag_filters=${{ matrix.tag_filters }},-os-sensitive,-se-manager
        //rb/...
