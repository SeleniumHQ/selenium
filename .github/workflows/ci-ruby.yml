name: CI - Ruby

# WIP: temporary debug workflow for investigating Windows server-start
# JVM crash (EXCEPTION_ACCESS_VIOLATION in jvm.dll). Revert before merge.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bazel-single-debug:
    name: Bazel single remote test (windows, debug)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          # Workaround for Windows long path issues
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Set resolution
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run single test with debug
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # JDK_JAVA_OPTIONS is honored by the `java` launcher (JDK 9+) and
          # affects every JVM spawned by the test. --test_output=streamed
          # so output is live (forces --test_strategy=exclusive, fine for
          # a single target).
          bazel test \
            --test_output=streamed \
            --cache_test_results=no \
            --test_env=SE_DEBUG=true \
            --test_env=JDK_JAVA_OPTIONS="-XX:ErrorFile=D:/hs_err_pid%p.log" \
            //rb/spec/integration/selenium/webdriver:select-firefox-remote
      - name: Collect hs_err and test outputs
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          # JVM crash reports land at the absolute path we set via
          # -XX:ErrorFile, no need to walk the drive.
          cp D:/hs_err_pid*.log build/debug/ 2>/dev/null || true
          cp D:/hs_err_pid*.mdmp build/debug/ 2>/dev/null || true
          # Bazel test logs
          TESTLOGS=$(bazel info bazel-testlogs 2>/dev/null || true)
          if [ -n "$TESTLOGS" ] && [ -d "$TESTLOGS" ]; then
            find "$TESTLOGS" -name 'test.log' -exec cp --parents {} build/debug/ \; 2>/dev/null || true
            find "$TESTLOGS" -name 'test.outputs*.zip' -exec cp --parents {} build/debug/ \; 2>/dev/null || true
          fi
          ls -laR build/debug || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-bazel-single-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7

  ruby-direct-server:
    name: Ruby starts server directly (windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      # Same JDK version bazel uses (rules_java 9.6.1 -> remotejdk_21 ==
      # Temurin 21.0.9+10, the version in the crash banner). Installing
      # it via setup-java rather than reusing the bazel-downloaded JDK
      # rules out "weird bazel-bundled JDK" as a variable.
      - name: Setup JDK 21.0.9
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.9
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Build standalone server jar
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: bazel build //java/src/org/openqa/selenium/grid:selenium_server_deploy.jar
      - name: Upload standalone jar (reusable across future debug runs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-standalone-jar
          path: bazel-bin/java/src/org/openqa/selenium/grid/selenium_server_deploy.jar
          if-no-files-found: warn
          retention-days: 7
      - name: Locate jar and java
        id: paths
        shell: bash
        run: |
          set -x
          JAR="bazel-bin/java/src/org/openqa/selenium/grid/selenium_server_deploy.jar"
          ls -la "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          # Use the setup-java JDK (matches bazel's JDK version exactly)
          JAVA="$JAVA_HOME/bin/java.exe"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "Using java: $JAVA"
          echo "Using jar:  $JAR"
          "$JAVA" -version 2>&1 || true
      - name: Launch server directly with java (no Ruby, control case)
        shell: bash
        continue-on-error: true
        env:
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/direct_hs_err_pid%p.log"
        run: |
          set -x
          "${{ steps.paths.outputs.java }}" \
            -jar "${{ steps.paths.outputs.jar }}" \
            standalone --port 4455 --selenium-manager true \
            --log-level FINE &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"
          sleep 15
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "server still alive after 15s - killing"
            kill "$SERVER_PID" 2>/dev/null || true
          else
            echo "server process already exited"
          fi
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Set Ruby version
        run: echo '3.3.11' > rb/.ruby-version
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          working-directory: rb
          bundler-cache: true
      - name: Launch server via Selenium::Server (Ruby)
        shell: bash
        continue-on-error: true
        env:
          SE_DEBUG: "true"
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/ruby_hs_err_pid%p.log"
          SERVER_JAR: ${{ github.workspace }}/${{ steps.paths.outputs.jar }}
          SERVER_JAVA: ${{ steps.paths.outputs.java }}
        run: |
          set -x
          cd rb
          # background: true so start returns after poll_for_ready
          # (otherwise process.wait blocks forever on a healthy server).
          # Then sleep briefly and stop to verify the stop path too.
          bundle exec ruby -I lib -r selenium-webdriver -e '
            require "selenium/server"
            jar  = ENV.fetch("SERVER_JAR")
            java = ENV.fetch("SERVER_JAVA")
            server = Selenium::Server.new(
              jar,
              java: java,
              port: 4456,
              log: true,
              background: true,
              timeout: 60,
              args: %w[--selenium-manager true --log-level FINE]
            )
            puts "starting server via Selenium::Server..."
            server.start
            puts "server reported ready - sleeping 5s then stopping"
            sleep 5
            server.stop
            puts "stopped cleanly"
          '
      - name: Collect hs_err files
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          cp D:/*hs_err_pid*.log build/debug/ 2>/dev/null || true
          cp D:/*hs_err_pid*.mdmp build/debug/ 2>/dev/null || true
          ls -la build/debug || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ruby-direct-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7

  xshare-off-test:
    name: Standalone jar with -Xshare:off (windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      - name: Setup JDK 21.0.9
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.9
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Build standalone server jar
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: bazel build //java/src/org/openqa/selenium/grid:selenium_server_deploy.jar
      - name: Locate jar and java
        id: paths
        shell: bash
        run: |
          set -x
          JAR="bazel-bin/java/src/org/openqa/selenium/grid/selenium_server_deploy.jar"
          ls -la "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          JAVA="$JAVA_HOME/bin/java.exe"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "Using java: $JAVA"
          echo "Using jar:  $JAR"
          "$JAVA" -version 2>&1 || true
      # CDS-disabled test: the original crash banner says
      # "mixed mode, sharing" - disabling Class Data Sharing is the most
      # common workaround for Windows-only JVM access violations in
      # jvm.dll. If a parallel default-CDS run reproduces the crash and
      # this one stays up, CDS is the culprit.
      - name: Launch standalone jar with -Xshare:off
        shell: bash
        continue-on-error: true
        env:
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/noshare_hs_err_pid%p.log -Xshare:off"
        run: |
          set -x
          "${{ steps.paths.outputs.java }}" \
            -jar "${{ steps.paths.outputs.jar }}" \
            standalone --port 4445 &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"
          sleep 15
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "server still alive after 15s - killing"
            kill "$SERVER_PID" 2>/dev/null || true
          else
            echo "server process already exited"
          fi
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Collect hs_err files
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          cp D:/*hs_err_pid*.log build/debug/ 2>/dev/null || true
          cp D:/*hs_err_pid*.mdmp build/debug/ 2>/dev/null || true
          ls -la build/debug || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-xshare-off-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7
