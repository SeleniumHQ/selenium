name: CI - Ruby

on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      smoke:
        description: Run smoke tests only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  minimize-linux-experiment:
    name: minimize-linux-experiment
    uses: ./.github/workflows/bazel.yml
    with:
      name: minimize-linux-experiment
      needs-display: true
      os: ubuntu
      rerun-with-debug: true
      run: >
        bazel test
        --keep_going
        --flaky_test_attempts 1
        --local_test_jobs 1
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        --test_output=all
        //rb/spec/integration/selenium/webdriver:window-chrome
