name: CI - Ruby

on:
  workflow_call:
    inputs:
      targets:
        required: false
        type: string
        default: ''
      run-full-suite:
        required: false
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run-full-suite }}
    uses: ./.github/workflows/bazel.yml
    with:
      name: Documentation
      run: bazel run //rb:docs

  steep-check:
    name: Type Check (Steep)
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run-full-suite }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.8
          bundler-cache: true
          working-directory: rb
      - name: Install RBS collection
        working-directory: rb
        run: bundle exec rbs collection install
      - name: Run Steep type check
        working-directory: rb
        run: bundle exec rake steep 2>/dev/null || (bundle exec rake steep && exit 1)

  unit-tests:
    name: Unit Tests
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.run-full-suite }}
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: 3.2.8
            os: ubuntu
          - ruby-version: 3.2.8
            os: windows
          - ruby-version: 3.2.8
            os: macos
          - ruby-version: 3.4.3
            os: ubuntu
          - ruby-version: jruby-10.0.0.0
            os: ubuntu
          - ruby-version: truffleruby-24.2.1
            os: ubuntu
    with:
      name: Unit Tests (${{ matrix.ruby-version }}, ${{ matrix.os }})
      os: ${{ matrix.os }}
      ruby-version: ${{ matrix.ruby-version }}
      run: >
        bazel test
        --keep_going
        --test_size_filters small
        --test_env=DEBUG=true
        //rb/spec/...

  filter-targets:
    name: Filter Targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.filter.outputs.targets }}
    steps:
      - name: Filter Ruby targets
        id: filter
        shell: bash
        run: |
          targets="${{ inputs.targets }}"
          filtered=()

          for t in $targets; do
            [[ "$t" == //rb* ]] && filtered+=("$t")
          done

          if [ ${#filtered[@]} -eq 0 ]; then
            echo "targets=//rb/spec/..." >> "$GITHUB_OUTPUT"
          else
            echo "targets=${filtered[*]}" >> "$GITHUB_OUTPUT"
          fi

  integration-tests-local:
    name: Browser Tests
    needs: filter-targets
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome-beta, firefox-beta]
        os: [windows]
        include:
          - browser: edge
            os: macos
    with:
      name: Browser Tests (${{ matrix.browser }}, ${{ matrix.os }})
      browser: ${{ matrix.browser }}
      os: ${{ matrix.os }}
      run: >
        bazel test
        --keep_going
        --build_tests_only
        --flaky_test_attempts 3
        --local_test_jobs 1
        --test_size_filters large
        --test_tag_filters ${{ matrix.browser }}
        --pin_browsers=false
        --test_env=SE_FORCE_BROWSER_DOWNLOAD=true
        --test_env=SE_SKIP_DRIVER_IN_PATH=true
        ${{ needs.filter-targets.outputs.targets }}
