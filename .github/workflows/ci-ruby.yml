name: CI - Ruby

# WIP: temporary debug workflow for investigating Windows server-start
# JVM crash (EXCEPTION_ACCESS_VIOLATION in jvm.dll). Revert before merge.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bazel-single-debug:
    name: Bazel single remote test (windows, debug)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          # Workaround for Windows long path issues
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Set resolution
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Prepare hs_err output dir
        shell: bash
        run: mkdir -p "$GITHUB_WORKSPACE/hs_err"
      - name: Run single test with debug
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # JDK_JAVA_OPTIONS is honored by the `java` launcher (JDK 9+) and
          # affects every JVM spawned by the test, including the one launched
          # by Selenium::Server. %p in ErrorFile is replaced with the pid.
          bazel test \
            --test_output=all \
            --cache_test_results=no \
            --test_env=SE_DEBUG=true \
            --test_env=JDK_JAVA_OPTIONS="-XX:ErrorFile=D:/hs_err_pid%p.log" \
            --test_env=TEST_DEBUG_DIR="D:/" \
            //rb/spec/integration/selenium/webdriver:select-firefox-remote
      - name: Collect hs_err and test outputs
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          # JVM crash reports written via JDK_JAVA_OPTIONS=-XX:ErrorFile.
          # No maxdepth - bazel sandboxes are deep and the JVM may fall back
          # to writing alongside the crashing process instead of the
          # absolute ErrorFile path.
          find /d -name 'hs_err_pid*.log' -exec cp {} build/debug/ \; 2>/dev/null || true
          find /d -name 'hs_err_pid*.mdmp' -exec cp {} build/debug/ \; 2>/dev/null || true
          find /c -name 'hs_err_pid*.log' -exec cp {} build/debug/ \; 2>/dev/null || true
          # Bazel test logs + any TEST_UNDECLARED_OUTPUTS the test wrote
          TESTLOGS=$(bazel info bazel-testlogs 2>/dev/null || true)
          if [ -n "$TESTLOGS" ] && [ -d "$TESTLOGS" ]; then
            find "$TESTLOGS" -name 'test.log' -exec cp --parents {} build/debug/ \; 2>/dev/null || true
            find "$TESTLOGS" -name 'test.outputs*.zip' -exec cp --parents {} build/debug/ \; 2>/dev/null || true
          fi
          ls -laR build/debug || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-bazel-single-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7

  ruby-direct-server:
    name: Ruby starts server directly (windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      # Same JDK version bazel uses (rules_java 9.6.1 -> remotejdk_21 ==
      # Temurin 21.0.9+10, the version in the crash banner). Installing
      # it via setup-java rather than reusing the bazel-downloaded JDK
      # rules out "weird bazel-bundled JDK" as a variable.
      - name: Setup JDK 21.0.9
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.9+10
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Build standalone server jar (./go java:package)
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        # Pass `--` so the task uses our (empty) args instead of falling
        # back to --config=release. Produces build/dist/selenium-server-*.jar.
        run: ./go "java:package[--]"
      - name: Upload standalone jar (reusable across future debug runs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-standalone-jar
          path: build/dist/selenium-server-*.jar
          if-no-files-found: warn
          retention-days: 7
      - name: Locate jar and java
        id: paths
        shell: bash
        run: |
          set -x
          ls -la build/dist || true
          JAR=$(find build/dist -name 'selenium-server-*.jar' | head -1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          # Use the setup-java JDK (matches bazel's JDK version exactly)
          JAVA="$JAVA_HOME/bin/java.exe"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "Using java: $JAVA"
          echo "Using jar:  $JAR"
          "$JAVA" -version 2>&1 || true
      - name: Launch server directly with java (no Ruby, control case)
        shell: bash
        continue-on-error: true
        env:
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/direct_hs_err_pid%p.log"
        run: |
          set -x
          "${{ steps.paths.outputs.java }}" \
            -jar "${{ steps.paths.outputs.jar }}" \
            standalone --port 4455 --selenium-manager true \
            --log-level FINE &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"
          # Give it up to 30s to either crash or start listening
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server process exited early (iteration $i)"
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Set Ruby version
        run: echo '3.3.11' > rb/.ruby-version
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.11
          working-directory: rb
          bundler-cache: true
      - name: Launch server via Selenium::Server (Ruby)
        shell: bash
        continue-on-error: true
        env:
          SE_DEBUG: "true"
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/ruby_hs_err_pid%p.log"
          SERVER_JAR: ${{ github.workspace }}/${{ steps.paths.outputs.jar }}
          SERVER_JAVA: ${{ steps.paths.outputs.java }}
        run: |
          set -x
          cd rb
          bundle exec ruby -I lib -r selenium-webdriver -e '
            require "selenium/server"
            jar  = ENV.fetch("SERVER_JAR")
            java = ENV.fetch("SERVER_JAVA")
            server = Selenium::Server.new(
              jar,
              java: java,
              port: 4456,
              log: true,
              background: false,
              timeout: 60,
              args: %w[--selenium-manager true --log-level FINE]
            )
            puts "starting server via Selenium::Server..."
            server.start
          '
      - name: Collect hs_err files
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          find /d -name '*hs_err_pid*.log' -exec cp {} build/debug/ \; 2>/dev/null || true
          find /d -name '*hs_err_pid*.mdmp' -exec cp {} build/debug/ \; 2>/dev/null || true
          find /c -name '*hs_err_pid*.log' -exec cp {} build/debug/ \; 2>/dev/null || true
          ls -la build/debug || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ruby-direct-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7

  release-jar-direct:
    name: Release jar (java:package) standalone (windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Disable 8dot3 short names
        run: fsutil 8dot3name set 0
      - name: Setup JDK 21.0.9
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21.0.9+10
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          bazelrc: common --color=yes
          output-base: D://b
          disk-cache: false
          repository-cache: true
      - name: Build standalone jar (./go java:package)
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ARG_CONV_EXCL: "*"
        # java:package produces build/dist/selenium-server-<version>.jar.
        # Pass `--` so the task uses our (empty) args instead of falling
        # back to --config=release - we don't want stamping for this debug.
        run: ./go "java:package[--]"
      - name: Locate built jar and java
        id: paths
        shell: bash
        run: |
          set -x
          ls -la build/dist || true
          JAR=$(find build/dist -name 'selenium-server-*.jar' | head -1)
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          JAVA="$JAVA_HOME/bin/java.exe"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"
          echo "Using java: $JAVA"
          echo "Using jar:  $JAR"
          "$JAVA" -version 2>&1 || true
      - name: Upload release jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-standalone-jar
          path: build/dist/selenium-server-*.jar
          if-no-files-found: warn
          retention-days: 7
      - name: Launch release jar with java -jar
        shell: bash
        continue-on-error: true
        env:
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/release_hs_err_pid%p.log"
        run: |
          set -x
          "${{ steps.paths.outputs.java }}" \
            -jar "${{ steps.paths.outputs.jar }}" \
            standalone --port 4444 &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server process exited early (iteration $i)"
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      # CDS-disabled retry: the crash banner says "mixed mode, sharing" -
      # disabling Class Data Sharing is the single most common workaround
      # for Windows-only JVM access violations in jvm.dll. If this one
      # stays up while the previous step crashed, CDS is the culprit.
      - name: Launch release jar with -Xshare:off
        shell: bash
        continue-on-error: true
        env:
          JDK_JAVA_OPTIONS: "-XX:ErrorFile=D:/release_noshare_hs_err_pid%p.log -Xshare:off"
        run: |
          set -x
          "${{ steps.paths.outputs.java }}" \
            -jar "${{ steps.paths.outputs.jar }}" \
            standalone --port 4445 &
          SERVER_PID=$!
          echo "server pid=$SERVER_PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server process exited early (iteration $i)"
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
      - name: Collect hs_err files
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p build/debug
          find /d -name '*hs_err_pid*.log' -exec cp {} build/debug/ \; 2>/dev/null || true
          find /d -name '*hs_err_pid*.mdmp' -exec cp {} build/debug/ \; 2>/dev/null || true
          find /c -name '*hs_err_pid*.log' -exec cp {} build/debug/ \; 2>/dev/null || true
          ls -la build/debug || true
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-jar-debug
          path: build/debug/**
          if-no-files-found: warn
          retention-days: 7
