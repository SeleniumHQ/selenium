name: CI - Ruby

# Throwaway diagnostic for Ruby Windows remote cache misses; never merge.
on:
  workflow_call:
    inputs:
      smoke:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      smoke:
        required: false
        type: boolean
        default: false
      target:
        description: Bazel test target pattern
        required: false
        type: string
        default: //rb/spec/unit:unit

permissions:
  contents: read
  packages: read

jobs:
  windows-diag:
    name: windows-diag-${{ matrix.attempt }}
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        attempt: [a, b]
    with:
      name: windows-diag-${{ matrix.attempt }}
      os: windows
      remote-cache: true
      artifact-name: ruby-windows-diag-${{ matrix.attempt }}
      artifact-path: build/diag/
      run: ./scripts/github-actions/ruby-windows-cache-diag.sh ${{ inputs.target || '//rb/spec/unit:unit' }}
