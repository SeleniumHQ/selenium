name: Nightly
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
    inputs:
      language:
        description: Language artefacts
        required: true
        type: choice
        default: "all"
        options:
          - all
          - java
          - ruby
          - python
          - grid
          - dotnet
          - javascript
  workflow_call:
    inputs:
      language:
        required: false
        type: string
        default: "all"

permissions:
  contents: read
  packages: write

jobs:
  check-release:
    name: Check Release Window
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    outputs:
      release-in-progress: ${{ steps.check.outputs.release-in-progress }}
    steps:
      - name: Check if release ruleset is active
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! ENFORCEMENT=$(gh api /repos/${{ github.repository }}/rulesets/11911909 --jq '.enforcement' 2>/dev/null); then
            echo "::warning::Failed to check release ruleset, assuming release in progress"
            echo "release-in-progress=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release-in-progress=$([[ "$ENFORCEMENT" == "active" ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

  nightly-release:
    name: Nightly ${{ inputs.language || 'all' }}
    needs: check-release
    if: >
      github.event.repository.fork == false &&
      needs.check-release.outputs.release-in-progress != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/bazel.yml
    with:
      name: Nightly ${{ inputs.language || 'all' }} Release
      nightly-release-files: ${{ (inputs.language || 'all') == 'grid' && 'build/dist/*.*' || '' }}
      run: ./go ${{ inputs.language || 'all' }}:release[nightly]
    secrets: inherit

  on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: nightly-release
    if: ${{ failure() }}
    steps:
      - uses: actions/checkout@v4
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_ICON_EMOJI: ":rotating_light:"
          SLACK_COLOR: failure
          SLACK_CHANNEL: selenium-tlc
          SLACK_USERNAME: GitHub Workflows
          SLACK_TITLE: Nightly ${{ inputs.language || 'all' }} Release failed
          MSG_MINIMAL: actions url
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
