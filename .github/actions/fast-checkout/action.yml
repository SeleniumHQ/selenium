name: 'Fast Checkout'
description: 'Intelligently determines how much history to fetch by default'
inputs:
  fetch-depth:
    description: 'Override the intelligent default for number of commits to fetch. 0 indicates all history.'
    required: false
    default: ''
  ref:
    description: 'The branch, tag or SHA to checkout.'
    required: false
    default: ''
  token:
    description: 'Personal access token (PAT) used to fetch the repository.'
    required: false
    default: ${{ github.token }}
  persist-credentials:
    description: 'Whether to configure the token or SSH key with the local git config.'
    required: false
    default: true
  repository:
    description: 'Repository name with owner. For example, actions/checkout.'
    required: false
    default: ${{ github.repository }}
  fetch-tags:
    description: 'Whether to fetch tags, even if fetch-depth > 0.'
    required: false
    default: false
outputs:
  depth:
    description: 'The fetch depth used'
    value: ${{ steps.calc.outputs.val }}

runs:
  using: "composite"
  steps:
    - name: Calculate Depth
      id: calc
      shell: bash
      run: |
        set -euo pipefail

        # Helper function to validate non-negative integer
        validate_depth() {
          local val="$1"
          val="${val//[[:space:]]/}"  # trim whitespace
          if [[ ! "$val" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid fetch-depth value: '$val'. Must be a non-negative integer."
            exit 1
          fi
          echo "$val"
        }

        # If explicit fetch-depth is provided, validate and use it
        if [ -n "${{ inputs.fetch-depth }}" ]; then
          DEPTH=$(validate_depth "${{ inputs.fetch-depth }}")
          echo "val=$DEPTH" >> "$GITHUB_OUTPUT"
        # Different repository - cannot use event-based calculation
        elif [ "${{ inputs.repository }}" != "${{ github.repository }}" ]; then
          echo "val=1" >> "$GITHUB_OUTPUT"
        # Pull request events - use commit count from PR
        elif [[ "${{ github.event_name }}" == "pull_request"* ]]; then
          PR_COMMITS="${{ github.event.pull_request.commits }}"
          if [[ -z "$PR_COMMITS" || ! "$PR_COMMITS" =~ ^[0-9]+$ ]]; then
            echo "::warning::Could not determine PR commit count, using default depth of 1"
            echo "val=1" >> "$GITHUB_OUTPUT"
          else
            echo "val=$((PR_COMMITS + 1))" >> "$GITHUB_OUTPUT"
          fi
        # Push events - count commits from event payload
        elif [ "${{ github.event_name }}" == "push" ]; then
          if [ ! -f "$GITHUB_EVENT_PATH" ]; then
            echo "::warning::Event payload not found, using default depth of 1"
            echo "val=1" >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(jq -e '.commits | length // 0' "$GITHUB_EVENT_PATH" 2>/dev/null) || COMMIT_COUNT=0
            if [[ ! "$COMMIT_COUNT" =~ ^[0-9]+$ ]]; then
              COMMIT_COUNT=0
            fi
            echo "val=$((COMMIT_COUNT + 1))" >> "$GITHUB_OUTPUT"
          fi
        # All other events (workflow_dispatch, schedule, etc.) - default to 1
        else
          echo "val=1" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ steps.calc.outputs.val }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        persist-credentials: ${{ inputs.persist-credentials }}
        repository: ${{ inputs.repository }}
        fetch-tags: ${{ inputs.fetch-tags }}
