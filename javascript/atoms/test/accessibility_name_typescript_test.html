<html>

<head>
  <meta charset="utf-8">
  <title>accessibility_name_typescript_test.html</title>
  <link rel="stylesheet" href="/filez/_main/third_party/js/qunit/qunit.css">
  <script src="/filez/_main/third_party/js/qunit/qunit.js"></script>
  <script src="/filez/_main/third_party/js/qunit/qunit_test_runner.js"></script>
  <script src="test_bootstrap.js"></script>
  <script src="../typescript/accessibility-snapshot-global.js"></script>
  <style>
    .star::before { content: "★ "; }
    .attr::before { content: attr(data-label) " "; }
    .attr-missing::before { content: attr(data-missing); }
    .slash::before { content: "1 / 2 "; }
    .alt::before { content: "★ " / "star "; }
    @media (min-width: 1px) { .nested::before { content: "Nested "; } }
    .more::after { content: " (more)"; }
    .icon::before { content: url(/testdata/map.png); }
    .icon-text::before { content: url(/testdata/map.png) "Pic "; }
    .toggled::before { content: "★ "; display: none; }
    .invisible-pseudo::before { content: "★ "; visibility: hidden; }
    #pseudo-part-host::part(b)::before { content: "Part "; }
    .gone { display: none; }
    .block { display: block; }
  </style>
  <script type="text/javascript">
    // Accessible name computation (https://w3c.github.io/accname/, 1.2) as the
    // snapshot atom implements it, with the html-aam element rules. Each
    // fixture is snapshotted as its own root and only `name` is asserted.
    var snapshot = window.bot.accessibility.typescript.snapshot;

    function byId(id) {
      var element = document.getElementById(id);
      if (!element) {
        throw new Error('no fixture with id ' + id);
      }
      return element;
    }

    function assertNames(assert, expectations) {
      Object.keys(expectations).forEach(function (id) {
        assert.strictEqual(snapshot(byId(id)).name, expectations[id], '#' + id);
      });
    }

    QUnit.module('aria-labelledby (2B)');

    QUnit.test('references are concatenated in attribute order with single spaces', function (assert) {
      assertNames(assert, { 'lb-one': 'First', 'lb-two': 'First Second', 'lb-reversed': 'Second First' });
    });

    QUnit.test('a hidden referenced element still contributes', function (assert) {
      assertNames(assert, { 'lb-hidden-ref': 'Hidden label', 'lb-aria-hidden-ref': 'Aria hidden label' });
    });

    QUnit.test('a self reference uses the control value, so "value label" comes out', function (assert) {
      assertNames(assert, { 'lb-self': 'typed Units' });
    });

    QUnit.test('references that resolve to nothing fall through to aria-label', function (assert) {
      assertNames(assert, { 'lb-missing': 'Fallback label' });
    });

    QUnit.test('aria-labelledby is not followed from a referenced element', function (assert) {
      // chain-a -> chain-b -> chain-c: a is named by b's content, not by c.
      assertNames(assert, { 'chain-a': 'B content', 'chain-b': 'C content' });
    });

    QUnit.test('two descendants that reference the same element both contribute it', function (assert) {
      // A row named from its cells, each labelled by the same header: the
      // header is read for each cell, not only for the first.
      assertNames(assert, { 'shared-ref-row': 'Qty Qty' });
    });

    QUnit.test('an id listed twice in one attribute contributes once, as Chromium reads it', function (assert) {
      assertNames(assert, { 'lb-dup': 'First' });
    });

    QUnit.test('aria-labelledby beats aria-label and content', function (assert) {
      assertNames(assert, { 'lb-beats-label': 'First' });
    });

    QUnit.module('aria-label (2C)');

    QUnit.test('aria-label is used as is, trimmed', function (assert) {
      assertNames(assert, { 'label-plain': 'Close', 'label-padded': 'Close', 'label-on-generic': 'Sidebar' });
    });

    QUnit.test('a whitespace-only aria-label is ignored', function (assert) {
      assertNames(assert, { 'label-blank': 'Content' });
    });

    QUnit.module('native labels (2D)');

    QUnit.test('label for', function (assert) {
      assertNames(assert, { 'for-input': 'Email', 'for-two-labels': 'First Second', 'for-select': 'Choice', 'for-textarea': 'Notes', 'for-button': 'Act' });
    });

    QUnit.test('a wrapping label names the control without the control itself', function (assert) {
      assertNames(assert, { 'wrapped-input': 'Name', 'wrapped-checkbox': 'Agree' });
    });

    QUnit.test('another control inside the label contributes its value', function (assert) {
      assertNames(assert, { 'qty-input': 'Quantity 3 units' });
    });

    QUnit.test('button inputs are named by value, with Submit and Reset defaults', function (assert) {
      assertNames(assert, { 'submit-value': 'Send', 'submit-default': 'Submit', 'reset-default': 'Reset', 'button-value': 'Go', 'image-alt': 'Picture button' });
    });

    QUnit.test('a button input takes its label ahead of its value (html-aam)', function (assert) {
      assertNames(assert, { 'labelled-submit': 'Send the form', 'labelled-reset': 'Start again' });
    });

    QUnit.test('img and area use alt, then title', function (assert) {
      assertNames(assert, { 'img-alt': 'Logo', 'img-title': 'Titled', 'area-alt': 'Region' });
    });

    QUnit.test('a present but empty alt is the final answer: title does not name a decorative image', function (assert) {
      assertNames(assert, { 'img-empty-alt-title': '' });
    });

    QUnit.test('fieldset legend, figure figcaption, table caption', function (assert) {
      assertNames(assert, { 'fieldset': 'Legend text', 'figure': 'Caption text', 'table': 'Table caption' });
    });

    QUnit.test('options and optgroups', function (assert) {
      assertNames(assert, { 'option-text': 'Two', 'option-label': 'Labelled', 'optgroup': 'Group' });
    });

    QUnit.test('svg title, iframe title', function (assert) {
      assertNames(assert, { 'svg': 'Chart', 'iframe': 'Frame title' });
    });

    QUnit.test('text inputs: title, then placeholder (pinned: html-aam puts title first)', function (assert) {
      assertNames(assert, {
        'input-title': 'Tip', 'input-placeholder': 'Hint', 'input-title-and-placeholder': 'Tip', 'textarea-placeholder': 'Hint',
        'number-placeholder': 'Age',
      });
    });

    QUnit.module('name from content (2F)');

    QUnit.test('roles that take their name from content', function (assert) {
      assertNames(assert, { 'h': 'Title', 'link': 'Go now', 'button': 'Save', 'cell': 'A', 'row': 'A B', 'tab': 'Tab', 'checkbox': 'Remember me' });
    });

    QUnit.test('roles that do not, even with content', function (assert) {
      assertNames(assert, { 'paragraph': '', 'generic-with-text': '', 'dialog': '', 'list': '', 'listitem': '', 'navigation': '', 'table-no-caption': '' });
    });

    QUnit.test('inline children concatenate without added spaces, block children get them', function (assert) {
      assertNames(assert, { 'inline-children': 'Savenow', 'block-children': 'A B', 'inline-block-children': 'A B' });
    });

    QUnit.test('br is a space', function (assert) {
      assertNames(assert, { 'br': 'Line one Line two' });
    });

    QUnit.test('hidden children are left out', function (assert) {
      assertNames(assert, { 'hidden-children': 'Save' });
    });

    QUnit.test('whitespace is collapsed and trimmed', function (assert) {
      assertNames(assert, { 'whitespace': 'lots of space' });
    });

    QUnit.test('descendants contribute through recursion whatever their role', function (assert) {
      assertNames(assert, { 'nested-span': 'Save', 'nested-img': 'Logo', 'nested-labelled': 'Nested label', 'nested-paragraph': 'Para text' });
    });

    QUnit.test('an embedded textbox contributes its value, a select its selected option', function (assert) {
      assertNames(assert, { 'embedded-textbox': 'Count 7 items', 'embedded-select': 'Pick Beta please' });
    });

    QUnit.test('an embedded control contributes its value even when it has a label of its own', function (assert) {
      assertNames(assert, { 'outer': 'Count 5' });
    });

    QUnit.test('two labels wrapping each other\'s control do not recurse forever', function (assert) {
      assertNames(assert, { 'x1': 'A', 'x2': 'B' });
    });

    QUnit.test('a custom listbox contributes only its selected options', function (assert) {
      assertNames(assert, { 'embedded-custom-listbox': 'Pick B now' });
    });

    QUnit.test('a contenteditable textbox contributes its rendered text only', function (assert) {
      assertNames(assert, { 'embedded-contenteditable': 'Say hello now' });
    });

    QUnit.test('an invisible child contributes neither its text nor its label nor generated content, only visible descendants', function (assert) {
      assertNames(assert, { 'invisible-child-sources': 'Save vis' });
    });

    QUnit.test('CSS generated content before and after is included', function (assert) {
      assertNames(assert, { 'pseudo-before': '★ Save', 'pseudo-after': 'Save (more)' });
    });

    QUnit.test('an attr() in generated content is the attribute of the element, whether or not the engine resolves it first', function (assert) {
      assertNames(assert, { 'pseudo-attr': 'Star Save', 'pseudo-attr-missing': 'Save' });
    });

    QUnit.test('a slash inside generated content is text; a bare slash introduces the alternative text', function (assert) {
      assertNames(assert, { 'pseudo-slash': '1 / 2 Save', 'pseudo-alt': 'star Save' });
    });

    QUnit.test('generated content is found wherever a sheet can define it', function (assert) {
      // A rule nested in @media, a shadow sheet styling its host, an adopted
      // stylesheet, and the UA stylesheet's quotes on q, which no author
      // sheet mentions.
      assertNames(assert, { 'pseudo-nested': 'Nested Save', 'pseudo-host': 'Pre Light', 'pseudo-adopted': 'Save (adopted)' });
    });

    QUnit.test('an image in generated content is not text; a string beside it is', function (assert) {
      // Chromium serialises the computed value as url("...") with the URL
      // quoted, which a reader of quoted strings must not take for text.
      assertNames(assert, { 'pseudo-url': 'Save', 'pseudo-url-text': 'Pic Save' });
    });

    QUnit.test('generated content of a pseudo-element that is not rendered is left out', function (assert) {
      assertNames(assert, { 'pseudo-display-none': 'Save', 'pseudo-invisible': 'Save' });
    });

    QUnit.test('generated content styled through ::part comes from the host\'s scope', function (assert) {
      var part = byId('pseudo-part-host').shadowRoot.getElementById('pseudo-part');
      assert.strictEqual(snapshot(part).name, 'Part Save');
    });

    QUnit.test('UA quotes on q are not text the atom can read (pinned limitation)', function (assert) {
      // The computed content is the keyword open-quote, not a string, so the
      // quote marks engines add to the name are absent here.
      assertNames(assert, { 'pseudo-quote': 'hi' });
    });

    QUnit.module('tooltip (2I) and the document');

    QUnit.test('title names an element that has nothing else', function (assert) {
      assertNames(assert, { 'title-only': 'Tip', 'title-abbr': 'World Wide Web' });
    });

    QUnit.test('title does not override content', function (assert) {
      assertNames(assert, { 'title-and-content': 'Save' });
    });

    QUnit.test('the document is named from the title', function (assert) {
      assert.strictEqual(snapshot().name, 'accessibility_name_typescript_test.html');
    });
  </script>
</head>

<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <span id="first">First</span><span id="second">Second</span>
  <div id="lb-one" aria-labelledby="first">x</div>

  <table id="table-no-caption"><tr><td>x</td></tr></table>

    <option>One</option>

  <button id="whitespace">  lots   of
    space </button>

  <a id="nested-img" href="#"><img src="/testdata/map.png" alt="Logo"></a>

  <button id="pseudo-attr-missing" class="attr-missing">Save</button>

  <script type="text/javascript">
    document.getElementById('pseudo-host').attachShadow({ mode: 'open' }).innerHTML =
      '<style>:host::before { content: "Pre "; }</style><slot></slot>';
    var adopted = new CSSStyleSheet();
    adopted.replaceSync('.adopted::after { content: " (adopted)"; }');
    document.adoptedStyleSheets = [adopted];
    document.getElementById('pseudo-part-host').attachShadow({ mode: 'open' }).innerHTML =
      '<button part="b" id="pseudo-part">Save</button>';
  </script>

  <label for="x1">A <input id="x2" type="text"></label><label for="x2">B <input id="x1" type="text"></label>

  <div id="embedded-contenteditable" role="heading" aria-level="2">Say <div role="textbox" contenteditable="true">hello <span style="display: none">secret</span></div> now</div>

  <button id="pseudo-after" class="more">Save</button>

  <button id="title-only" title="Tip"></button>
  <abbr id="title-abbr" title="World Wide Web">WWW</abbr>
  <button id="title-and-content" title="Tip">Save</button>
</body>
