<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>focusable_typescript_test.html</title>
  <link rel="stylesheet" href="/filez/_main/third_party/js/qunit/qunit.css">
  <script src="/filez/_main/third_party/js/qunit/qunit.js"></script>
  <script src="/filez/_main/third_party/js/qunit/qunit_test_runner.js"></script>
  <script src="test_bootstrap.js"></script>
  <script src="../typescript/is-focusable-global.js"></script>
  <script type="text/javascript">
    // Ported from bot.dom.isFocusable: a form field, or a non-negative
    // tabindex, or editable.
    var isFocusable = window.bot.dom.typescript.isFocusable;

    function byId(id) {
      return document.getElementById(id);
    }

    QUnit.test('form fields are focusable', function (assert) {
      ['an-anchor', 'an-area', 'a-button', 'an-input', 'a-label', 'a-select', 'a-textarea'].forEach(function (id) {
        assert.strictEqual(isFocusable(byId(id)), true, id + ' should be focusable');
      });
    });

    QUnit.test('an ordinary element is not focusable', function (assert) {
      assert.strictEqual(isFocusable(byId('a-div')), false, 'plain div');
      assert.strictEqual(isFocusable(byId('a-span')), false, 'plain span');
    });

    QUnit.test('a non-negative tabindex makes an element focusable', function (assert) {
      assert.strictEqual(isFocusable(byId('tabindex-zero')), true, 'tabindex=0');
      assert.strictEqual(isFocusable(byId('tabindex-positive')), true, 'tabindex=3');
    });

    QUnit.test('a negative tabindex does not', function (assert) {
      assert.strictEqual(isFocusable(byId('tabindex-negative')), false, 'tabindex=-1');
    });

    QUnit.test('an editable element is focusable', function (assert) {
      assert.strictEqual(isFocusable(byId('editable-div')), true);
    });

    QUnit.test('form fields stay focusable regardless of the disabled attribute', function (assert) {
      // isFocusable is a shape question, not a reachability one.
      assert.strictEqual(isFocusable(byId('disabled-button')), true);
    });
  </script>
</head>

<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>

  <a id="an-anchor" href="#">anchor</a>
  <map name="a-map">
    <area id="an-area" shape="rect" coords="0,0,1,1" href="#">
  </map>
  <button type="button" id="a-button">button</button>
  <button type="button" id="disabled-button" disabled>disabled</button>
  <input type="text" id="an-input">
  <label id="a-label" for="an-input">label</label>
  <select id="a-select">
    <option>one</option>
  </select>
  <textarea id="a-textarea"></textarea>

  <div id="a-div">plain</div>
  <span id="a-span">plain</span>
  <div id="tabindex-zero" tabindex="0">zero</div>
  <div id="tabindex-positive" tabindex="3">three</div>
  <div id="tabindex-negative" tabindex="-1">minus one</div>
  <div id="editable-div" contenteditable="true">editable</div>
</body>

</html>
