<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>keyboard_typescript_test.html</title>
  <link rel="stylesheet" href="/filez/_main/third_party/js/qunit/qunit.css">
  <script src="/filez/_main/third_party/js/qunit/qunit.js"></script>
  <script src="/filez/_main/third_party/js/qunit/qunit_test_runner.js"></script>
  <script src="test_bootstrap.js"></script>
  <script src="../typescript/testing/keyboard-global.js"></script>
</head>

<body>
  <div id="qunit"></div>
  <div id="qunit-fixture"></div>
  <input id="target">
  <input id="other">
  <textarea id="area"></textarea>
  <input id="email" type="email">
  <input id="limited" maxlength="3">
  <div id="editable" contenteditable="true"></div>
  <div id="plain">not focusable</div>
  <div id="closed-host"></div>
  <iframe name="sink" style="display:none"></iframe>
  <form id="with-button" target="sink" action="about:blank">
    <input id="with-button-field"><input id="with-button-second"><button id="submit-button">go</button>
  </form>
  <form id="single" target="sink" action="about:blank">
    <input type="hidden" name="h"><input type="checkbox" name="c"><input id="single-field">
  </form>
  <form id="double" target="sink" action="about:blank">
    <input id="double-field"><input>
  </form>
  <form id="disabled-button" target="sink" action="about:blank">
    <input id="disabled-button-field"><button disabled>go</button>
  </form>
  <form id="named-elements" target="sink" action="about:blank">
    <input id="named-elements-field" name="elements"><input><button>go</button>
  </form>
  <form id="named-request-submit" target="sink" action="about:blank">
    <input id="named-request-submit-field" name="requestSubmit">
  </form>
  <script type="text/javascript">
    // Assertions ported from keyboard_test.html, with the expected numbers
    // replaced by what Chrome and Firefox report for real key presses today
    // (recorded 2026-10-13 through WebDriver): keypress carries the character
    // code on both keyCode and charCode in both engines, and only character
    // keys and Enter get a keypress. The Closure page expected Firefox's old
    // split codes and a keypress for Escape and arrows.
    //
    // Added: key/code, modifier flags, the beforeinput / textInput / input
    // sequence and its cancellation, text and caret editing (previously only
    // covered through type_test.html), contenteditable, focus following, and
    // implicit form submission.
    var kb = window.bot.keyboard.typescript;
    var Keys = kb.Keys;
    var isGecko = /\bGecko\//.test(navigator.userAgent);
    var isMac = /Macintosh/.test(navigator.userAgent);

    var keyboard;
    var listeners = [];

    function $(id) { return document.getElementById(id); }

    // document.activeElement stops at a closed root's host and nothing can
    // look through it; only a reference to the field itself gets inside.
    var closedField = (function() {
      var root = $('closed-host').attachShadow({mode: 'closed'});
      root.innerHTML = '<input>';
      return root.querySelector('input');
    })();

    function record(el, types) {
      var log = [];
      (types || ['keydown', 'keypress', 'beforeinput', 'textInput', 'input', 'keyup']).forEach(function(type) {
        function listener(e) {
          log.push({type: e.type, key: e.key, code: e.code, keyCode: e.keyCode, charCode: e.charCode,
              inputType: e.inputType, data: e.data, shiftKey: e.shiftKey, ctrlKey: e.ctrlKey,
              repeat: e.repeat, location: e.location, target: e.target});
        }
        el.addEventListener(type, listener);
        listeners.push([el, type, listener]);
      });
      return log;
    }

    function on(el, type, fn) {
      el.addEventListener(type, fn);
      listeners.push([el, type, fn]);
    }

    function types(log) { return log.map(function(e) { return e.type; }); }

    function tap(key) {
      keyboard.pressKey(key);
      keyboard.releaseKey(key);
    }

    function typeText(text) {
      Array.from(text).forEach(function(ch) {
        var pair = kb.fromChar(ch);
        var shift = pair.shift && !keyboard.isPressed(Keys.SHIFT);
        if (shift) keyboard.pressKey(Keys.SHIFT);
        tap(pair.key);
        if (shift) keyboard.releaseKey(Keys.SHIFT);
      });
    }

    QUnit.testStart(function() {
      ['target', 'other', 'area', 'email', 'limited'].forEach(function(id) { $(id).value = ''; });
      closedField.value = '';
      $('editable').textContent = '';
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      keyboard = new kb.Keyboard();
    });

    QUnit.testDone(function() {
      listeners.forEach(function(l) { l[0].removeEventListener(l[1], l[2]); });
      listeners = [];
    });

    function assertKeyCodes(assert, key, shift, down, press, keyValue, code) {
      keyboard.moveCursor($('target'));
      var log = record($('target'), ['keydown', 'keypress', 'keyup']);
      if (shift) keyboard.pressKey(Keys.SHIFT);
      log.length = 0;
      tap(key);
      if (shift) keyboard.releaseKey(Keys.SHIFT);
      var expected = press ? ['keydown', 'keypress', 'keyup'] : ['keydown', 'keyup'];
      assert.deepEqual(types(log).slice(0, expected.length), expected);
      assert.strictEqual(log[0].keyCode, down, 'down keyCode');
      assert.strictEqual(log[0].charCode, 0, 'down charCode');
      if (press) {
        assert.strictEqual(log[1].keyCode, press, 'press keyCode');
        assert.strictEqual(log[1].charCode, press, 'press charCode');
      }
      var up = log[expected.length - 1];
      assert.strictEqual(up.keyCode, down, 'up keyCode');
      assert.strictEqual(log[0].key, keyValue, 'key');
      assert.strictEqual(log[0].code, code, 'code');
    }

    QUnit.test('lower case', function(assert) {
      assertKeyCodes(assert, Keys.G, false, 71, 103, 'g', 'KeyG');
    });

    QUnit.test('upper case', function(assert) {
      assertKeyCodes(assert, Keys.G, true, 71, 71, 'G', 'KeyG');
    });

    QUnit.test('space', function(assert) {
      assertKeyCodes(assert, Keys.SPACE, false, 32, 32, ' ', 'Space');
    });

    QUnit.test('punctuation without shift', function(assert) {
      assertKeyCodes(assert, Keys.SEMICOLON, false, isGecko ? 59 : 186, 59, ';', 'Semicolon');
    });

    QUnit.test('punctuation with shift', function(assert) {
      assertKeyCodes(assert, Keys.SEMICOLON, true, isGecko ? 59 : 186, 58, ':', 'Semicolon');
    });

    QUnit.test('equals and hyphen use the engine keydown codes', function(assert) {
      assertKeyCodes(assert, Keys.EQUALS, false, isGecko ? 61 : 187, 61, '=', 'Equal');
      assertKeyCodes(assert, Keys.HYPHEN, false, isGecko ? 173 : 189, 45, '-', 'Minus');
    });

    QUnit.test('enter', function(assert) {
      assertKeyCodes(assert, Keys.ENTER, false, 13, 13, 'Enter', 'Enter');
    });

    QUnit.test('arrow has no keypress', function(assert) {
      assertKeyCodes(assert, Keys.DOWN, false, 40, 0, 'ArrowDown', 'ArrowDown');
    });

    QUnit.test('esc has no keypress', function(assert) {
      assertKeyCodes(assert, Keys.ESC, false, 27, 0, 'Escape', 'Escape');
    });

    QUnit.test('meta', function(assert) {
      assertKeyCodes(assert, Keys.META, false, isGecko && isMac ? 224 : 91, 0, 'Meta', 'MetaLeft');
    });

    QUnit.test('control sets its own flag on keydown and clears it on keyup', function(assert) {
      keyboard.moveCursor($('target'));
      var log = record($('target'), ['keydown', 'keypress', 'keyup']);
      tap(Keys.CONTROL);
      assert.deepEqual(types(log), ['keydown', 'keyup']);
      assert.strictEqual(log[0].keyCode, 17);
      assert.strictEqual(log[0].key, 'Control');
      assert.strictEqual(log[0].location, 1, 'left');
      assert.strictEqual(log[0].ctrlKey, true);
      assert.strictEqual(log[1].ctrlKey, false);
    });

    QUnit.test('unknown character', function(assert) {
      var ch = '爱';
      var pair = kb.fromChar(ch);
      assert.strictEqual(pair.shift, false);
      assertKeyCodes(assert, pair.key, false, ch.charCodeAt(0), ch.charCodeAt(0), ch, '');
    });

    QUnit.test('characters outside the BMP are one key', function(assert) {
      keyboard.moveCursor($('target'));
      var log = record($('target'), ['keypress', 'input']);
      typeText('😀');
      assert.strictEqual($('target').value, '😀');
      assert.strictEqual(log[0].charCode, 0x1F600);
      assert.strictEqual(log[1].data, '😀');
    });

    QUnit.test('pressing a held key again repeats', function(assert) {
      keyboard.moveCursor($('target'));
      var log = record($('target'), ['keydown']);
      keyboard.pressKey(Keys.A);
      keyboard.pressKey(Keys.A);
      keyboard.releaseKey(Keys.A);
      assert.deepEqual(log.map(function(e) { return e.repeat; }), [false, true]);
      assert.strictEqual($('target').value, 'aa');
    });

    QUnit.test('modifier rules', function(assert) {
      keyboard.moveCursor($('target'));
      keyboard.pressKey(Keys.SHIFT);
      assert.ok(keyboard.isPressed(Keys.SHIFT));
      assert.throws(function() { keyboard.pressKey(Keys.SHIFT); },
          function(e) { return e.code === 'unknown error'; }, 'modifier already pressed');
      keyboard.releaseKey(Keys.SHIFT);
      assert.notOk(keyboard.isPressed(Keys.SHIFT));
      assert.throws(function() { keyboard.releaseKey(Keys.SHIFT); },
          function(e) { return e.code === 'unknown error'; }, 'not pressed');
    });

    QUnit.test('modifiers held are reported on other keys', function(assert) {
      keyboard.moveCursor($('target'));
      var log = record($('target'), ['keydown']);
      keyboard.pressKey(Keys.CONTROL);
      tap(Keys.A);
      keyboard.releaseKey(Keys.CONTROL);
      assert.strictEqual(log[1].key, 'a');
      assert.strictEqual(log[1].ctrlKey, true);
    });

    // -- text editing --------------------------------------------------------

    QUnit.test('typing a character fires the real event sequence', function(assert) {
      keyboard.moveCursor($('target'));
      var log = record($('target'));
      typeText('a');
      assert.deepEqual(types(log), ['keydown', 'keypress', 'beforeinput', 'textInput', 'input', 'keyup']);
      assert.strictEqual(log[2].inputType, 'insertText');
      assert.strictEqual(log[2].data, 'a');
      assert.strictEqual(log[3].data, 'a');
      assert.strictEqual(log[4].inputType, 'insertText');
      assert.strictEqual($('target').value, 'a');
    });

    QUnit.test('types at the caret and replaces a selection', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      el.value = 'ac';
      el.setSelectionRange(1, 1);
      typeText('b');
      assert.strictEqual(el.value, 'abc');
      assert.strictEqual(el.selectionStart, 2);

      el.setSelectionRange(0, 2);
      typeText('X');
      assert.strictEqual(el.value, 'Xc');
      assert.strictEqual(el.selectionStart, 1);
    });

    QUnit.test('moveCursor puts the caret at the end only when focus changes', function(assert) {
      var el = $('target');
      el.value = 'abc';
      keyboard.moveCursor(el);
      assert.strictEqual(document.activeElement, el);
      assert.strictEqual(el.selectionStart, 3);
      el.setSelectionRange(1, 1);
      keyboard.moveCursor(el);
      assert.strictEqual(el.selectionStart, 1, 'already focused: caret kept');
    });

    QUnit.test('cancelling keydown, keypress, beforeinput or textInput stops the edit', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      ['keydown', 'keypress', 'beforeinput', 'textInput'].forEach(function(type) {
        var log = record(el, ['input']);
        function cancel(e) { e.preventDefault(); }
        el.addEventListener(type, cancel);
        typeText('z');
        el.removeEventListener(type, cancel);
        assert.strictEqual(el.value, '', type + ' cancelled: no text');
        assert.strictEqual(log.length, 0, type + ' cancelled: no input event');
      });
    });

    QUnit.test('keydown cancelled suppresses keypress', function(assert) {
      keyboard.moveCursor($('target'));
      var log = record($('target'), ['keydown', 'keypress', 'keyup']);
      on($('target'), 'keydown', function(e) { e.preventDefault(); });
      tap(Keys.E);
      assert.deepEqual(types(log), ['keydown', 'keyup']);
    });

    QUnit.test('maxlength is respected', function(assert) {
      keyboard.moveCursor($('limited'));
      typeText('abcdef');
      assert.strictEqual($('limited').value, 'abc');
    });

    QUnit.test('backspace and delete', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      typeText('abcd');
      var log = record(el, ['beforeinput', 'input']);
      tap(Keys.BACKSPACE);
      assert.strictEqual(el.value, 'abc');
      assert.deepEqual(log.map(function(e) { return e.type + ':' + e.inputType; }),
          ['beforeinput:deleteContentBackward', 'input:deleteContentBackward']);

      el.setSelectionRange(0, 0);
      log.length = 0;
      tap(Keys.BACKSPACE);
      assert.strictEqual(el.value, 'abc', 'nothing before the caret');
      assert.strictEqual(log.length, 0, 'no input events when nothing changes');

      tap(Keys.DELETE);
      assert.strictEqual(el.value, 'bc');
      assert.strictEqual(log[0].inputType, 'deleteContentForward');

      el.setSelectionRange(0, 2);
      tap(Keys.BACKSPACE);
      assert.strictEqual(el.value, '', 'selection deleted');
    });

    QUnit.test('backspace removes a whole surrogate pair', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      typeText('a😀');
      tap(Keys.BACKSPACE);
      assert.strictEqual(el.value, 'a');
    });

    QUnit.test('arrows step over a whole surrogate pair', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      typeText('a😀b');
      tap(Keys.LEFT);
      tap(Keys.LEFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [1, 1], 'left');
      tap(Keys.RIGHT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [3, 3], 'right');
      keyboard.pressKey(Keys.SHIFT);
      tap(Keys.LEFT);
      keyboard.releaseKey(Keys.SHIFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [1, 3], 'shift+left');
    });

    QUnit.test('arrows, home and end move the caret', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      typeText('abcd');
      tap(Keys.LEFT);
      tap(Keys.LEFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [2, 2]);
      tap(Keys.RIGHT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [3, 3]);
      tap(Keys.HOME);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [0, 0]);
      tap(Keys.LEFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [0, 0], 'stops at the start');
      tap(Keys.END);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [4, 4]);
      tap(Keys.RIGHT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [4, 4], 'stops at the end');
    });

    QUnit.test('shift with arrows, home and end selects', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      typeText('abcd');
      keyboard.pressKey(Keys.SHIFT);
      tap(Keys.LEFT);
      tap(Keys.LEFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [2, 4]);
      tap(Keys.RIGHT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [3, 4], 'shrinks from the moving end');
      tap(Keys.HOME);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [0, 4]);
      keyboard.releaseKey(Keys.SHIFT);
      tap(Keys.LEFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [0, 0], 'collapses to the start');
      keyboard.pressKey(Keys.SHIFT);
      tap(Keys.END);
      keyboard.releaseKey(Keys.SHIFT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [0, 4]);
      tap(Keys.RIGHT);
      assert.deepEqual([el.selectionStart, el.selectionEnd], [4, 4], 'collapses to the end');
    });

    QUnit.test('enter inserts a line break in a textarea', function(assert) {
      var el = $('area');
      keyboard.moveCursor(el);
      typeText('a');
      var log = record(el, ['beforeinput', 'input']);
      tap(Keys.ENTER);
      typeText('b');
      assert.strictEqual(el.value, 'a\nb');
      assert.strictEqual(log[0].inputType, 'insertLineBreak');
      assert.strictEqual(log[1].inputType, 'insertLineBreak');
    });

    QUnit.test('enter in a text input fires beforeinput but no input', function(assert) {
      var el = $('target');
      keyboard.moveCursor(el);
      var log = record(el, ['beforeinput', 'input']);
      tap(Keys.ENTER);
      assert.deepEqual(log.map(function(e) { return e.type + ':' + e.inputType; }),
          ['beforeinput:insertLineBreak']);
      assert.strictEqual(el.value, '');
    });

    QUnit.test('fields without the selection API append', function(assert) {
      var el = $('email');
      keyboard.moveCursor(el);
      var log = record(el, ['input']);
      typeText('a@b.c');
      assert.strictEqual(el.value, 'a@b.c');
      assert.strictEqual(log.length, 5);
      tap(Keys.BACKSPACE);
      assert.strictEqual(el.value, 'a@b.');
    });

    QUnit.test('keys follow focus when a handler moves it', function(assert) {
      on($('target'), 'input', function() { $('other').focus(); });
      keyboard.moveCursor($('target'));
      typeText('ab');
      assert.strictEqual($('target').value, 'a');
      assert.strictEqual($('other').value, 'b');
    });

    QUnit.test('moveCursor keeps focus where a focus handler redirects it', function(assert) {
      // Focus events only fire while the window has system focus.
      if (!document.hasFocus()) {
        assert.expect(0);
        return;
      }
      on($('target'), 'focus', function() { $('other').focus(); });
      keyboard.moveCursor($('target'));
      assert.strictEqual(document.activeElement, $('other'));
      typeText('a');
      assert.strictEqual($('target').value, '');
      assert.strictEqual($('other').value, 'a');
    });

    QUnit.test('keys reach a field inside a closed shadow root', function(assert) {
      closedField.value = 'ab';
      keyboard.moveCursor(closedField);
      typeText('c');
      assert.strictEqual(closedField.value, 'abc', 'caret moved to the end and the key typed');
    });

    QUnit.test('keys follow focus out of a closed shadow root when a handler moves it', function(assert) {
      on(closedField, 'input', function() { $('other').focus(); });
      keyboard.moveCursor(closedField);
      typeText('ab');
      assert.strictEqual(closedField.value, 'a');
      assert.strictEqual($('other').value, 'b');
    });

    QUnit.test('moveCursor blurs the focused element when the target cannot take focus', function(assert) {
      $('target').focus();
      keyboard.moveCursor($('plain'));
      assert.notStrictEqual(document.activeElement, $('target'));
    });

    // -- contenteditable ------------------------------------------------------

    QUnit.test('typing into contenteditable edits the DOM', function(assert) {
      var el = $('editable');
      el.textContent = 'ab';
      keyboard.moveCursor(el);
      var log = record(el, ['beforeinput', 'input']);
      typeText('c');
      assert.strictEqual(el.textContent, 'abc');
      assert.deepEqual(log.map(function(e) { return e.type + ':' + e.inputType + ':' + e.data; }),
          ['beforeinput:insertText:c', 'input:insertText:c']);
      tap(Keys.BACKSPACE);
      assert.strictEqual(el.textContent, 'ab');
    });

    QUnit.test('cancelling beforeinput stops a contenteditable edit', function(assert) {
      var el = $('editable');
      el.textContent = 'ab';
      keyboard.moveCursor(el);
      on(el, 'beforeinput', function(e) { e.preventDefault(); });
      var log = record(el, ['input']);
      typeText('c');
      assert.strictEqual(el.textContent, 'ab');
      assert.strictEqual(log.length, 0);
    });

    // -- implicit submission ---------------------------------------------------

    function submits(assert, formId, fieldId) {
      var submitted = 0, clicked = 0;
      on($(formId), 'submit', function(e) { submitted++; e.preventDefault(); });
      on($(formId), 'click', function() { clicked++; });
      keyboard.moveCursor($(fieldId));
      tap(Keys.ENTER);
      return {submitted: submitted, clicked: clicked};
    }

    QUnit.test('enter clicks the default button', function(assert) {
      assert.deepEqual(submits(assert, 'with-button', 'with-button-field'), {submitted: 1, clicked: 1});
    });

    QUnit.test('enter submits a form with one blocking field and no button', function(assert) {
      assert.deepEqual(submits(assert, 'single', 'single-field'), {submitted: 1, clicked: 0});
    });

    QUnit.test('enter does not submit a form with two blocking fields and no button', function(assert) {
      assert.deepEqual(submits(assert, 'double', 'double-field'), {submitted: 0, clicked: 0});
    });

    QUnit.test('enter does nothing when the default button is disabled', function(assert) {
      assert.deepEqual(submits(assert, 'disabled-button', 'disabled-button-field'), {submitted: 0, clicked: 0});
    });

    // Named controls shadow form properties, so these must not be read off the form.
    QUnit.test('enter clicks the default button when a control is named elements', function(assert) {
      assert.deepEqual(submits(assert, 'named-elements', 'named-elements-field'), {submitted: 1, clicked: 1});
    });

    QUnit.test('enter submits when a control is named requestSubmit', function(assert) {
      assert.deepEqual(submits(assert, 'named-request-submit', 'named-request-submit-field'), {submitted: 1, clicked: 0});
    });

    QUnit.test('cancelling the enter keydown stops implicit submission', function(assert) {
      on($('with-button-field'), 'keydown', function(e) { e.preventDefault(); });
      assert.deepEqual(submits(assert, 'with-button', 'with-button-field'), {submitted: 0, clicked: 0});
    });
  </script>
</body>

</html>
