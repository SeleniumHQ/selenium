[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "selenium-manager-linux-x86-64"
version = "4.45.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Selenium Manager binary for Linux x86-64"
requires-python = ">=3.9"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Topic :: Software Development :: Testing",
]

[project.urls]
homepage = "https://www.selenium.dev"
source = "https://github.com/SeleniumHQ/selenium/tree/trunk/py/selenium-manager-linux-x86-64"
issues = "https://github.com/SeleniumHQ/selenium/issues"

[project.scripts]
selenium-manager = "selenium_manager_linux_x86_64:main"

[tool.setuptools.package-data]
selenium_manager_linux_x86_64 = ["bin/selenium-manager"]
