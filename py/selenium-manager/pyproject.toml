[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "selenium-manager"
version = "4.50.0.202609091537"
license = "Apache-2.0"
description = "Selenium Manager — browser and driver manager for the Selenium ecosystem"
readme = "README.rst"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "selenium-manager-linux-x86-64==4.50.0.202609091537; sys_platform=='linux' and platform_machine=='x86_64'",
    "selenium-manager-linux-aarch64==4.50.0.202609091537; sys_platform=='linux' and platform_machine=='aarch64'",
    "selenium-manager-macos==4.50.0.202609091537; sys_platform=='darwin'",
    "selenium-manager-windows==4.50.0.202609091537; sys_platform=='win32'",
]

# The only console script across the five distributions; the platform packages
# ship a binary and a path to it, never a command that could contend for this name.
[project.scripts]
selenium-manager = "selenium_manager:main"

[project.urls]
homepage = "https://www.selenium.dev"
source = "https://github.com/SeleniumHQ/selenium/tree/trunk/py/selenium-manager"
download = "https://pypi.org/project/selenium-manager"
documentation = "https://www.selenium.dev/documentation/selenium_manager"
issues = "https://github.com/SeleniumHQ/selenium/issues"

[tool.setuptools.packages.find]
include = ["selenium_manager*"]
