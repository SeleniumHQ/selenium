# Ruff config for Python files outside py/ directory (scripts, build tools, etc.)
# The py/ directory has its own config in py/pyproject.toml

extend = "py/pyproject.toml"

include = [
    "scripts/**/*.py",
    "common/**/*.py",
    "dotnet/**/*.py",
    "java/**/*.py",
    "javascript/**/*.py",
    "rb/**/*.py",
]

exclude = [
    "**/node_modules/**",
    "**/.bundle/**",
]
